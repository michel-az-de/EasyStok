name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build + dotnet test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Postgres efemero para os testes de integracao (EasyStock.Inventario.IntegrationTests,
    # ADR Inventario/Fatia 0). O fixture le a conn string de EASYSTOCK_IT_PG (setada no
    # step Test) e cria o role NOSUPERUSER rls_test_client sujeito a RLS. Sem este service,
    # os testes [SkippableFact] SKIPam; o guard nao-skip Harness_executa... vira o gate
    # vermelho se a env var estiver setada mas o banco indisponivel. Bloco espelha
    # restore-test-rotulos.yml.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: easystock_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EasyStok.CI.slnf

      - name: Build
        run: dotnet build EasyStok.CI.slnf -c Release --no-restore -warnaserror

      - name: Test
        env:
          # Conn string do service postgres (superuser). SSL Mode=Disable: o container
          # oficial nao tem TLS e o Npgsql 9.x tentaria handshake. O fixture deriva dela
          # o login NOSUPERUSER rls_test_client para exercer a RLS de verdade.
          EASYSTOCK_IT_PG: "Host=localhost;Port=5432;Database=easystock_ci;Username=postgres;Password=postgres;SSL Mode=Disable"
          # Timeout do ScribanRenderer: 2s no CI (500ms em prod/local). O runner sob JIT frio/GC
          # estoura 500ms na primeira renderizacao de template -- flaky de timing (issue #910,
          # flaky-tests.md). NAO relaxa a guarda de producao, so o piso do runner lento.
          EASYSTOK_SCRIBAN_TIMEOUT_MS: '2000'
        run: >-
          dotnet test EasyStok.CI.slnf
          -c Release --no-build --no-restore
          --filter "Category!=ArchitectureDebt"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 14
