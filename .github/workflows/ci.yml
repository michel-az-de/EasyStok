name: CI

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test:
    name: Build + dotnet test
    runs-on: ubuntu-latest
    # O gate atingiu 20 min no post-cache após testes aprovados; reserve tempo para finalizar o job.
    timeout-minutes: 30
    # Postgres efemero para os testes de integracao (EasyStock.Inventario.IntegrationTests,
    # ADR Inventario/Fatia 0). O fixture le a conn string de EASYSTOCK_IT_PG (setada no
    # step Test) e cria o role NOSUPERUSER rls_test_client sujeito a RLS. Sem este service,
    # os testes [SkippableFact] SKIPam; o guard nao-skip Harness_executa... vira o gate
    # vermelho se a env var estiver setada mas o banco indisponivel. Bloco espelha
    # restore-test-rotulos.yml.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # #1796: o Postgres sobe num passo, e não em `services:`, para a imagem vir por espelhos com
      # nova tentativa (scripts/ci/puxar-imagem.sh). O `services:` puxa de uma fonte só e reprova o
      # job inteiro quando ela limita o runner.
      - name: Postgres efemero
        run: |
          set -euo pipefail
          bash scripts/ci/puxar-imagem.sh postgres:16
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=easystock_ci postgres:16
          for i in $(seq 1 30); do
            docker exec postgres pg_isready -U postgres -d easystock_ci && exit 0
            sleep 2
          done
          docker logs postgres
          exit 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore EasyStok.CI.slnf

      - name: Build
        run: dotnet build EasyStok.CI.slnf -c Release --no-restore -warnaserror

      # #1514: as imagens dos fixtures Testcontainers vem de espelhos e recebem a tag do Docker Hub;
      # com a imagem local o Testcontainers nao puxa nada (limite anonimo do Hub). Puxadas em serie
      # e com fallback entre espelhos (#1796).
      - name: Imagens dos testes por espelho
        run: |
          set -euo pipefail
          bash scripts/ci/puxar-imagem.sh postgres:16-alpine postgres:17-alpine
          for i in 1 2 3 4 5; do docker pull -q ghcr.io/axllent/mailpit:v1.31.3 && break; [ "$i" = 5 ] && exit 1; sleep $((i * 5)); done
          docker tag ghcr.io/axllent/mailpit:v1.31.3 axllent/mailpit:v1.31.3

      - name: Test
        env:
          # Conn string do service postgres (superuser). SSL Mode=Disable: o container
          # oficial nao tem TLS e o Npgsql 9.x tentaria handshake. O fixture deriva dela
          # o login NOSUPERUSER rls_test_client para exercer a RLS de verdade.
          EASYSTOCK_IT_PG: "Host=localhost;Port=5432;Database=easystock_ci;Username=postgres;Password=postgres;SSL Mode=Disable"
          # Timeout do ScribanRenderer: 2s no CI (500ms em prod/local). O runner sob JIT frio/GC
          # estoura 500ms na primeira renderizacao de template -- flaky de timing (issue #910,
          # flaky-tests.md). NAO relaxa a guarda de producao, so o piso do runner lento.
          EASYSTOK_SCRIBAN_TIMEOUT_MS: '2000'
          # #1514: o Ryuk (testcontainers/ryuk) viria do Docker Hub, que estoura o limite anonimo; o
          # runner e descartado ao fim do job, entao a limpeza dele nao faz falta.
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        run: >-
          dotnet test EasyStok.CI.slnf
          -c Release --no-build --no-restore
          --filter "Category!=ArchitectureDebt"
          --logger "trx;LogFileName=test-results.trx"
          --logger "console;verbosity=normal"
          --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          retention-days: 14
