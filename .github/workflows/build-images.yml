# build-images — builda as imagens da VM (api/web/worker) no CI e pusha pro GHCR.
# Poda P01 (#1169): a imagem do Admin saiu junto com o projeto.
# Issue 605: as imagens prontas no registry servem de reserva e de prova de que o Dockerfile
# builda no CI. A VPS hoje builda local pelo scripts/deploy/vps-deploy.sh (#1890).
#
# - Tags: :latest e :<sha do commit>.
# - GIT_SHA via build-arg, declarado só no estágio runtime dos Dockerfiles —
#   não invalida o cache de camadas (issue 572).
# - Cache buildx type=gha com escopo por imagem (restore/publish do NuGet ficam
#   quentes entre commits).
name: build-images

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Push novo em master cancela o build do commit anterior: so a tag do HEAD atual interessa.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
          - name: web
            dockerfile: Dockerfile.Web
          # #878: o Worker (outbox/notificacoes/SLA/jobs de cobranca) nao era buildado
          # nem deployado na VM canonica. Sem esta imagem, o compose da VPS nao
          # tem servico worker e nada de background roda em prod.
          - name: worker
            dockerfile: EasyStock.Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push easystok-${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/easystok-${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/easystok-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=easystok-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=easystok-${{ matrix.name }}

