# build-images — builda as imagens da VM (api/web/worker) no CI e pusha pro GHCR.
# Poda P01 (#1169): a imagem do Admin saiu junto com o projeto.
# #3323: a VPS puxa daqui a imagem do sha (scripts/deploy/vps-deploy.sh) em vez de buildar de
# novo; o build local virou o fallback. Estas imagens sao o caminho do deploy.
#
# - Tags: :<sha do commit> sempre; :latest so no master (rodada manual numa branch nao mexe nele).
# - GIT_SHA via build-arg, declarado só no estágio runtime dos Dockerfiles —
#   não invalida o cache de camadas (issue 572).
# - Cache buildx type=gha mode=min, escopo v2 por imagem: so as camadas da imagem final.
#   O mode=max exportava todo estagio de build e levava 123 s dos 296 s da api (medido).
# - provenance: false: sem attestation, o manifesto fica simples e o push mais curto.
name: build-images

on:
  push:
    branches: [master, main]
  workflow_dispatch:

# Push novo em master cancela o build do commit anterior: so a tag do HEAD atual interessa.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile
          - name: web
            dockerfile: Dockerfile.Web
          # #878: o Worker (outbox/notificacoes/SLA/jobs de cobranca) nao era buildado
          # nem deployado na VM canonica. Sem esta imagem, o compose da VPS nao
          # tem servico worker e nada de background roda em prod.
          - name: worker
            dockerfile: EasyStock.Worker/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push easystok-${{ matrix.name }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/easystok-${{ matrix.name }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/master' && format('ghcr.io/{0}/easystok-{1}:latest', github.repository_owner, matrix.name) || '' }}
          cache-from: type=gha,scope=easystok-v2-${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=easystok-v2-${{ matrix.name }}

