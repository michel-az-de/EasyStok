name: CodeQL

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 5 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # EasyStock.Mobile e um projeto MAUI Android que exige o workload
      # maui-android. Sem isso, "dotnet build EasyStok.sln" falha com
      # NETSDK1147 e o CodeQL nao analisa nada.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Restore + Build
        run: |
          dotnet restore EasyStok.sln
          dotnet build EasyStok.sln --configuration Release --no-restore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: sarif-results
          upload: failure-only

      # ADR-0052: a Api autentica por JWT bearer e CSRF nao se aplica a bearer.
      # O CodeQL nao reconhece [IgnoreAntiforgeryToken], entao a regra sai da Api
      # aqui e volta nos controllers que usam cookie (storefront, issue #1088).
      # A lista "+" e conferida pelo CodeQlCsrfFilterTests: usar cookie na Api
      # sem reincluir o arquivo quebra o gate. A Web nao e filtrada.
      - name: Filter SARIF (CSRF falso positivo na Api bearer)
        uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: |
            -EasyStock.Api/**:cs/web/missing-token-validation
            +EasyStock.Api/Controllers/Storefront/AuthController.cs:cs/web/missing-token-validation
            +EasyStock.Api/Controllers/Storefront/AvaliacaoController.cs:cs/web/missing-token-validation
            +EasyStock.Api/Controllers/Storefront/CheckoutController.cs:cs/web/missing-token-validation
            +EasyStock.Api/Controllers/Storefront/PedidosClienteController.cs:cs/web/missing-token-validation
          input: sarif-results/${{ matrix.language }}.sarif
          output: sarif-results/${{ matrix.language }}.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results/${{ matrix.language }}.sarif
          category: "/language:${{ matrix.language }}"
