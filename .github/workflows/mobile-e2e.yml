name: PWA E2E Tests

# Roda as suites da PWA (tests/pwa/*.test.js) em todo PR/push que toca a
# PWA ou os testes. Nao requer Android SDK: o runner vanilla (node
# tests/pwa/run.js) carrega EasyStock.Api/wwwroot/pwa/index.html num sandbox
# vm com stubs de DOM/Storage/Navigator.

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tests/pwa/**'
      - 'EasyStock.Api/wwwroot/pwa/**'
      - '.github/workflows/mobile-e2e.yml'
  pull_request:
    paths:
      - 'tests/pwa/**'
      - 'EasyStock.Api/wwwroot/pwa/**'
      - '.github/workflows/mobile-e2e.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run E2E tests
        run: node tests/pwa/run.js
        env:
          PWA_HTML: ${{ github.workspace }}/EasyStock.Api/wwwroot/pwa/index.html
