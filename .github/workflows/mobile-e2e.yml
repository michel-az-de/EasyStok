name: PWA E2E Tests

# Roda as suites da PWA (tests/pwa/*.test.js) em todo PR/push que toca a
# PWA ou os testes. Nao requer Android SDK: o runner vanilla (node
# tests/pwa/run.js) carrega EasyStock.Api/wwwroot/pwa/index.html num sandbox
# vm com stubs de DOM/Storage/Navigator.

on:
  push:
    branches: [ master, main ]
    paths:
      - 'tests/pwa/**'
      - 'EasyStock.Api/wwwroot/pwa/**'
      - '.github/workflows/mobile-e2e.yml'
      - 'casa-da-baba-mobile/**'
      - 'scripts/deploy/ota-*'
  pull_request:
    paths:
      - 'tests/pwa/**'
      - 'EasyStock.Api/wwwroot/pwa/**'
      - '.github/workflows/mobile-e2e.yml'
      - 'casa-da-baba-mobile/**'
      - 'scripts/deploy/ota-*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run E2E tests
        run: node tests/pwa/run.js
        env:
          PWA_HTML: ${{ github.workspace }}/EasyStock.Api/wwwroot/pwa/index.html

  # Atualizador OTA do APK piloto (#2065): assinatura, hash, replay, caminho do ZIP,
  # estado atômico e retorno de versão. Roda em host, sem Android SDK.
  apk-ota:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O jar é imutável e fixado por sha256: o cache poupa o Maven Central, que limita a taxa com 429 (#3261).
      - name: Cache do org.json do harness nativo
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/json-20231013.jar
          key: org-json-20231013-0f18192d

      - name: Baixar org.json do harness nativo
        timeout-minutes: 5
        run: |
          JAR="$RUNNER_TEMP/json-20231013.jar"
          # Só baixa sem cache. Repete no 429 com teto de tempo; Retry-After acima do teto desiste na hora.
          [ -f "$JAR" ] || curl -fSL --no-progress-meter --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 10 --retry-max-time 120 -o "$JAR" \
            https://repo1.maven.org/maven2/org/json/json/20231013/json-20231013.jar
          echo "0f18192df289114e17aa1a0d0a7f8372cc9f5c7e4f7e39adcf8906fe714fa7d3  $JAR" | sha256sum -c -

      - name: Testes nativos do atualizador
        shell: pwsh
        run: ./casa-da-baba-mobile/apk/tests/run-native.ps1 -JsonJar "$env:RUNNER_TEMP/json-20231013.jar"

      - name: Instalar dependências do bridge Android
        run: npm ci --prefix casa-da-baba-mobile/apk --ignore-scripts --no-audit --no-fund

      # Os contratos de ícones renderizam a fachada JSX/Lucide do Console real.
      - name: Instalar dependências canônicas dos ícones do Console
        run: npm ci --prefix EasyStock.Console --ignore-scripts --no-audit --no-fund

      - name: Validar contratos do APK e do bridge Android
        run: node --test casa-da-baba-mobile/apk/tests/*.test.cjs
