name: Deploy to Render (master)

# Pipeline oficial de produção.
#
# Etapas:
#   1. build + testes .NET
#   2. reescreve CACHE_VERSION no sw.js da PWA com o SHA
#   3. exige aprovação manual no GitHub Environment "production"
#   4. dispara deploy hooks dos 3 services Render (api / web / worker)
#   5. health-check final
#
# Render também tem auto-deploy ligado em master (render.yaml), então os
# deploy hooks aqui servem como "trigger explícito + ordem garantida":
# API primeiro, depois Web/Worker.

on:
  # Desabilitado do gatilho por push: Render suspenso + build quebra por maui ausente (ADR-0029).
  # Mantido so manual; o deploy real de producao e o deploy-fly.
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'

permissions:
  contents: read

jobs:
  build-test:
    name: Build + Tests
    runs-on: ubuntu-latest
    outputs:
      sha-short: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - id: sha
        run: echo "short=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Rewrite CACHE_VERSION
        shell: pwsh
        run: ./scripts/rewrite-cache-version.ps1 -Sha "${{ github.sha }}"

      - name: Restore + Build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Upload rewritten sw.js
        uses: actions/upload-artifact@v4
        with:
          name: pwa-sw
          path: |
            EasyStock.Api/wwwroot/pwa/sw.js
          if-no-files-found: warn
          retention-days: 1

  promote:
    name: Promote to Render (requires approval)
    runs-on: ubuntu-latest
    needs: [build-test]
    environment: production    # GitHub Environment com required reviewers
    steps:
      - name: Trigger Render API deploy
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"

      - name: Wait API health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://easystok-api.onrender.com/health || echo 000)
            echo "attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && exit 0
            sleep 10
          done
          echo "::error::API health não atingiu 200 em 5min"
          exit 1

      - name: Trigger Render Web/Worker
        run: |
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WEB }}"
          curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_WORKER }}"

      - name: Smoke test Web (PWA)
        run: |
          for i in $(seq 1 20); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://easystok-web.onrender.com/health || echo 000)
            echo "web attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
