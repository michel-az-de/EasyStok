name: Build e homologação

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      api_url:
        description: URL da API já implantada para homologar
        required: true
        type: string
      console_url:
        description: URL do console já implantado para homologar
        required: true
        type: string
      api_sha:
        description: SHA completo esperado na API
        required: true
        type: string
      console_sha:
        description: SHA completo esperado no console
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (preview)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Rewrite CACHE_VERSION (preview)
        shell: pwsh
        env:
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./scripts/rewrite-cache-version.ps1 -Sha $env:PREVIEW_SHA
      - run: dotnet restore EasyStok.CI.slnf
      - run: dotnet build EasyStok.CI.slnf -c Release --no-restore
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/homologacao/verificar-http.test.mjs

  homologacao-http:
    name: Homologação HTTP (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verificar disponibilidade e versões publicadas
        env:
          HOMOLOGACAO_API_URL: ${{ inputs.api_url }}
          HOMOLOGACAO_CONSOLE_URL: ${{ inputs.console_url }}
          HOMOLOGACAO_API_SHA: ${{ inputs.api_sha }}
          HOMOLOGACAO_CONSOLE_SHA: ${{ inputs.console_sha }}
        run: node scripts/homologacao/verificar-http.mjs
