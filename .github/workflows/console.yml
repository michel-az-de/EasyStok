name: console

# Console do operador (ADR-0054): lint (oxlint), fronteira de camadas e build.
# Roda só quando a pasta do console muda; o gate .NET fica no ci.yml.
on:
  pull_request:
    paths:
      - 'EasyStock.Console/**'
      - '.github/workflows/console.yml'
  push:
    branches: [master]
    paths:
      - 'EasyStock.Console/**'
      - '.github/workflows/console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: EasyStock.Console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: EasyStock.Console/package-lock.json
      - run: npm ci
      - run: npm run qualidade
      - run: node ferramentas/prova-1255-pagamento-manual-api.mjs
      - run: node ferramentas/prova-1420-sugestao-agente-api.mjs
      - run: node ferramentas/prova-f06-honestidade.mjs
      - run: node ferramentas/prova-f11-lote-papel.mjs
      - run: node ferramentas/prova-f11-cardapio-do-dia.mjs
      - run: node ferramentas/prova-f11-cardapio-itens.mjs
      - run: node ferramentas/prova-f11-link-na-conversa.mjs
      - run: node ferramentas/prova-1447-hall-modulos.mjs
      - run: node ferramentas/prova-onda1-shell.mjs
      - run: node ferramentas/prova-perfis-modulos.mjs
      - run: node ferramentas/prova-sessao-cozinha.mjs
      - run: node ferramentas/prova-notificacoes-sessao.mjs
      - run: node ferramentas/prova-1446-cozinha-viva.mjs
      - run: node ferramentas/prova-1474-revisao-visual.mjs
      - run: node ferramentas/prova-1474-ficha-api.mjs
      - run: node ferramentas/prova-1481-gestao-cardapio.mjs
      - run: node ferramentas/prova-1482-item-cardapio.mjs
      - run: node ferramentas/prova-1483-categorias-cardapio.mjs
      - run: node ferramentas/prova-1490-estoque-do-dia.mjs
      - run: node ferramentas/prova-1491-producao-do-dia.mjs
      - run: node ferramentas/prova-1496-insumos.mjs
      - run: node ferramentas/prova-1498-receitas.mjs
      - run: node ferramentas/prova-1499-baixa-insumo.mjs
      - run: node ferramentas/prova-1502-planejamento.mjs
      - run: node ferramentas/prova-1511-perdas.mjs
      - run: node ferramentas/prova-1424-mensagem-programada-api.mjs
