<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var tema = window.localStorage.getItem('casa-da-baba:tema')
          if (tema === 'light' || tema === 'dark') {
            document.documentElement.setAttribute('data-theme', tema)
          }
        } catch (erro) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Casa da Baba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:opsz,wght@14..32,400..700&family=IBM+Plex+Mono:wght@400;600&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
