server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SSE da operação (S18): fluxo longo e sem buffer, senão cai em 30 s ou chega em blocos (F13, #1243).
    location ^~ /api/operacao/eventos {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # /api/ vai inteiro (mesmo caminho) para a API: api-falsa no modo demonstração,
    # a API real no modo API (API_UPSTREAM, ver Dockerfile.web).
    location ^~ /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets com hash no nome (#2254): nunca mudam, o navegador guarda por um ano.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Arquivo com extensão que não existe (favicon.ico, mapa antigo...) é 404, não o app inteiro.
    location ~ \.[A-Za-z0-9]+$ {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, max-age=0";
        try_files $uri $uri/ /index.html;
    }
}
