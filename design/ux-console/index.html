<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyStok — menos, mas inteligente (protótipo vivo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   CALMA — estética editorial tipo Apple aplicada a ERP.
   Espaço em branco como material. Cor é informação, não decoração:
   laranja = ação, verde/âmbar/vermelho = estado. O resto é tinta.
   ══════════════════════════════════════════════════════════════ */
:root{
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:22px; --r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1); --d1:160ms; --d2:280ms;
  --z-sticky:100; --z-modal:400; --z-popover:500; --z-toast:700;
}
:root[data-theme="light"]{
  --page:#FBFBFC; --card:#FFFFFF; --hover:#F4F4F6; --pressed:#EDEDF0;
  --text:#1D1D1F; --text-2:#48484E; --text-3:#6E6E73; --text-4:#A1A1A6;
  --hairline:#E8E8ED; --hairline-2:#DCDCE1;
  --accent:#E85814; --accent-hover:#C94A0F; --accent-soft:#FDF1EA; --accent-text:#C2410C;
  --ok:#0E7A3D; --ok-soft:#EBF7EF; --warn:#8A5A00; --warn-soft:#FBF4DF; --crit:#B3261E; --crit-soft:#FCEBEA;
  --shadow-card:0 1px 2px rgba(0,0,0,.03),0 8px 24px rgba(0,0,0,.04);
  --shadow-pop:0 4px 14px rgba(0,0,0,.08),0 16px 48px rgba(0,0,0,.10);
}
:root[data-theme="dark"]{
  --page:#131316; --card:#1D1D20; --hover:#26262A; --pressed:#2E2E33;
  --text:#F5F5F7; --text-2:#C7C7CC; --text-3:#98989D; --text-4:#636366;
  --hairline:#2C2C30; --hairline-2:#3A3A3F;
  --accent:#F26B25; --accent-hover:#F8884A; --accent-soft:rgba(232,88,20,.13); --accent-text:#F8884A;
  --ok:#4CC38A; --ok-soft:rgba(24,135,78,.14); --warn:#EFC75E; --warn-soft:rgba(181,122,0,.16); --crit:#EF9A8C; --crit-soft:rgba(192,59,42,.15);
  --shadow-card:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-pop:0 4px 14px rgba(0,0,0,.4),0 16px 48px rgba(0,0,0,.45);
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:15px;line-height:1.5;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-text);text-decoration:none} a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-s)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4)}
.skip-link{position:fixed;top:-48px;left:16px;z-index:var(--z-toast);background:var(--card);padding:8px 16px;border-radius:var(--r-s);box-shadow:var(--shadow-pop);transition:top var(--d2) var(--ease)}
.skip-link:focus-visible{top:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes drawerIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.view-enter{animation:fadeUp .3s var(--ease)}
.row-new{animation:fadeUp .4s var(--ease)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--hairline-2);border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
<style>
/* ═══ CHROME MÍNIMO ═══ */
.topbar{position:sticky;top:0;z-index:var(--z-sticky);height:54px;display:flex;align-items:center;gap:14px;
  padding:0 24px;background:color-mix(in srgb, var(--page) 80%, transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--hairline)}
.tb-logo{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;letter-spacing:-.02em}
.tb-logo span em{font-style:normal;color:var(--accent)}
.tb-logo .env{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4);
  border:1px solid var(--hairline-2);padding:2px 7px;border-radius:var(--r-pill)}
.tb-logo.back::before{content:"‹";font-size:18px;color:var(--text-3);font-weight:400}
.topbar .spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:9px;height:32px;width:min(300px,34vw);padding:0 11px;
  border-radius:var(--r-pill);background:var(--hover);color:var(--text-3);font-size:13px;transition:background var(--d1) var(--ease)}
.search-trigger:hover{background:var(--pressed)}
.search-trigger kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-4)}
.icon-btn{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;color:var(--text-3);position:relative;transition:background var(--d1) var(--ease)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn .dot{position:absolute;top:5px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.avatar-tb{width:27px;height:27px;border-radius:50%;background:var(--text);color:var(--page);display:grid;place-items:center;font-size:10.5px;font-weight:700}
.density-toggle{display:flex;gap:2px;background:var(--hover);border-radius:var(--r-pill);padding:2px}
.density-toggle button{height:24px;padding:0 11px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;color:var(--text-3);transition:all var(--d1) var(--ease)}
.density-toggle button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.stage{min-height:calc(100vh - 54px)}
.wrap{max-width:1060px;margin:0 auto;padding:34px 26px 90px}
.wrap.narrow{max-width:660px}

/* ═══ HOME "HOJE" — quase vazia, cada linha trabalha ═══ */
.hello{font-size:30px;font-weight:800;letter-spacing:-.035em;animation:fadeUp .3s var(--ease)}
.hello-sub{font-size:14px;color:var(--text-3);margin-top:5px}
.hello-sub b{color:var(--text);font-weight:600}
.now-line{display:flex;gap:26px;flex-wrap:wrap;margin:26px 0 6px;animation:fadeUp .35s var(--ease)}
.now-item .n-v{font-family:var(--font-mono);font-size:24px;font-weight:600;letter-spacing:-.02em}
.now-item .n-l{font-size:12px;color:var(--text-3);margin-top:2px}
.now-item.warn .n-v{color:var(--warn)}
.now-item.crit .n-v{color:var(--crit)}
.home-cta{display:flex;gap:10px;margin:22px 0 34px;animation:fadeUp .4s var(--ease)}
.att-block{margin:0 0 34px;animation:fadeUp .45s var(--ease)}
.att-line{display:flex;align-items:baseline;gap:10px;padding:11px 2px;border-top:1px solid var(--hairline);font-size:14px;color:var(--text-2)}
.att-line:last-child{border-bottom:1px solid var(--hairline)}
.att-line b{color:var(--text)}
.att-line .a{margin-left:auto;flex-shrink:0;font-weight:600;font-size:13px}
.ctx-list{border-top:1px solid var(--hairline);animation:fadeUp .5s var(--ease)}
.ctx-row{display:flex;align-items:center;gap:14px;width:100%;padding:15px 2px;border-bottom:1px solid var(--hairline);text-align:left;transition:background var(--d1) var(--ease)}
.ctx-row:hover{background:var(--hover)}
.ctx-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;background:var(--hover);color:var(--text-2)}
.ctx-name{font-size:15px;font-weight:700;letter-spacing:-.01em}
.ctx-state{font-size:13px;color:var(--text-3)}
.ctx-state b{color:var(--text);font-weight:600}
.ctx-arrow{margin-left:auto;color:var(--text-4);font-size:18px;transition:transform var(--d1) var(--ease),color var(--d1) var(--ease)}
.ctx-row:hover .ctx-arrow{transform:translateX(3px);color:var(--text)}

/* ═══ MÓDULO ═══ */
.mod-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.mod-head h1{font-size:23px;font-weight:800;letter-spacing:-.03em}
.mod-head .mh-sub{font-size:13px;color:var(--text-3);margin-top:3px}
.mod-tabs{display:flex;gap:2px;margin:16px 0 22px;border-bottom:1px solid var(--hairline)}
.mtab{padding:8px 13px;font-size:13.5px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color var(--d1) var(--ease)}
.mtab:hover{color:var(--text)}
.mtab[aria-selected="true"]{color:var(--text);font-weight:700;border-bottom-color:var(--text)}
.mtab .ct{font-family:var(--font-mono);font-size:10.5px;margin-left:5px;color:var(--text-4)}
.tab-note{font-size:13px;color:var(--text-3);margin:-8px 0 16px}

/* ═══ CONTROLES ═══ */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 15px;border-radius:var(--r-pill);font-size:13.5px;font-weight:600;
  transition:background var(--d1) var(--ease),transform var(--d1) var(--ease),color var(--d1) var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-dark{background:var(--text);color:var(--page)}
.btn-dark:hover{opacity:.88}
.btn-secondary{background:transparent;border:1px solid var(--hairline-2);color:var(--text)}
.btn-secondary:hover{border-color:var(--text-3)}
.btn-sm{height:29px;font-size:12.5px;padding:0 12px}
.btn-block{width:100%;justify-content:center;height:48px;font-size:15px;border-radius:var(--r-m)}
.btn:disabled{background:var(--pressed);color:var(--text-4);cursor:not-allowed}
kbd.k{font-family:var(--font-mono);font-size:10px;color:var(--text-4)}
.btn-primary kbd.k,.btn-dark kbd.k{color:rgba(255,255,255,.6)}
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-crit{background:var(--crit-soft);color:var(--crit)}
.pill-neutral{background:var(--pressed);color:var(--text-3)}

/* ═══ LISTA-TABELA calma (linhas editoriais, hairlines) ═══ */
.rows{border-top:1px solid var(--hairline)}
.row{display:grid;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--hairline);transition:background var(--d1) var(--ease)}
.row:hover{background:var(--hover)}
.row-main{font-weight:600;font-size:14px}
.row-sub{font-size:12.5px;color:var(--text-3);margin-top:1px}
.row-num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13.5px}
.wait-fresh{color:var(--ok);font-weight:600}.wait-warn{color:var(--warn);font-weight:600}.wait-late{color:var(--crit);font-weight:700}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:var(--r-pill);font-size:12.5px;font-weight:600;
  background:var(--hover);color:var(--text-2);transition:background var(--d1) var(--ease)}
.chip:hover{background:var(--pressed)}
.chip.on{background:var(--text);color:var(--page)}
.chip-add{border:1px dashed var(--hairline-2);background:transparent;color:var(--accent-text)}
.chip-add:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip-on{background:var(--accent-soft);color:var(--accent-text)}
.chip-on .x{display:grid;place-items:center;width:15px;height:15px;border-radius:50%}
.chip-on .x:hover{background:var(--accent);color:#fff}
.filter-clear{font-size:12.5px;font-weight:600;color:var(--accent-text)}
.popover{position:absolute;z-index:var(--z-popover);background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:14px;width:224px;animation:fadeUp .18s var(--ease)}
.popover h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px}
.popover select{width:100%;height:34px;padding:0 8px;border:1px solid var(--hairline-2);border-radius:var(--r-s);background:var(--card);font:inherit;font-size:13px;margin-bottom:10px}
.popover .btn{width:100%;justify-content:center}

/* ═══ FORMS calmos (1 coluna, labels leves) ═══ */
.f-field{margin-bottom:18px}
.f-label{display:block;font-size:13px;font-weight:600;color:var(--text-2);margin-bottom:7px}
.f-hint{font-size:12px;color:var(--text-4);margin-top:6px;line-height:1.5}
.f-input{width:100%;height:44px;padding:0 14px;border:1px solid var(--hairline-2);border-radius:var(--r-m);background:var(--card);font-size:15px;transition:border-color var(--d1) var(--ease),box-shadow var(--d1) var(--ease)}
.f-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.f-input{height:auto;padding:11px 14px;resize:vertical}
.f-input.big{height:56px;font-size:17px;font-weight:600}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.search-box{position:relative}
.search-box .s-ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-4);pointer-events:none}
.search-box .f-input{padding-left:40px}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:var(--z-popover);background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow-pop);overflow:hidden;animation:fadeUp .16s var(--ease)}
.suggest button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left;font-size:14px}
.suggest button:hover,.suggest button.sel{background:var(--hover)}
.suggest .s-sub{font-size:12px;color:var(--text-4);margin-left:auto}
details.more{margin-top:6px;border-top:1px solid var(--hairline)}
details.more>summary{display:flex;align-items:center;gap:8px;padding:14px 2px;cursor:pointer;list-style:none;font-size:13.5px;font-weight:600;color:var(--text-3)}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"+";margin-left:auto;font-size:16px;color:var(--text-4)}
details.more[open]>summary::after{content:"–"}
details.more .more-body{padding:4px 0 16px}

/* ═══ item picker do pedido ═══ */
.draft-bar{position:sticky;top:54px;z-index:var(--z-sticky);display:flex;align-items:center;justify-content:space-between;gap:14px;
  margin:-8px -16px 22px;padding:13px 16px;border-radius:var(--r-m);
  background:color-mix(in srgb, var(--card) 88%, transparent);backdrop-filter:blur(12px);box-shadow:var(--shadow-card)}
.draft-bar .d-k{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4)}
.draft-bar .d-t{font-size:14.5px;font-weight:700}
.draft-bar .d-total{font-family:var(--font-mono);font-size:19px;font-weight:600}
.order-item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--hairline)}
.order-item .oi-name{font-weight:600;font-size:14px}
.order-item .oi-price{font-size:12.5px;color:var(--text-3)}
.qty{display:flex;align-items:center;gap:2px;margin-left:auto}
.qty button{width:28px;height:28px;border-radius:50%;background:var(--hover);font-size:15px;font-weight:600;display:grid;place-items:center;transition:background var(--d1)}
.qty button:hover{background:var(--pressed)}
.qty .q-v{font-family:var(--font-mono);font-size:14px;font-weight:600;min-width:26px;text-align:center}
.oi-x{color:var(--text-4);width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.oi-x:hover{background:var(--crit-soft);color:var(--crit)}

/* ═══ KPI tipográfico (sem card-box) ═══ */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin:6px 0 26px}
.kpi .k-l{font-size:12px;color:var(--text-3)}
.kpi .k-v{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:4px}
.kpi .k-d{font-size:12px;font-weight:600;margin-top:3px}
.k-d.up{color:var(--ok)} .k-d.down{color:var(--crit)} .k-d.flat{color:var(--warn)}

/* ═══ barra de composição (Stripe) fina ═══ */
.comp{height:8px;border-radius:var(--r-pill);overflow:hidden;display:flex;margin:18px 0 12px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend-row{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--text-2)}
.legend-row i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-row .v{margin-left:auto;font-family:var(--font-mono);font-weight:600;color:var(--text)}

/* ═══ drawer de detalhe (Stripe) ═══ */
.drawer-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.3);z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity var(--d1)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:var(--z-modal);background:var(--card);
  box-shadow:var(--shadow-pop);transform:translateX(100%);transition:transform var(--d2) var(--ease);display:flex;flex-direction:column}
body.drawer-open .drawer-backdrop{opacity:1;pointer-events:auto}
body.drawer-open .drawer{transform:translateX(0)}
.drawer-head{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--hairline)}
.drawer-head h2{font-size:17px;font-weight:800;letter-spacing:-.02em;flex:1}
.drawer-body{flex:1;overflow-y:auto;padding:20px}
.dr-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--hairline);font-size:13.5px}
.dr-row:last-child{border-bottom:0}
.dr-row .dr-k{color:var(--text-3)}
.dr-row .dr-v{font-weight:600;text-align:right}

/* ═══ stepper calmo ═══ */
.steps{display:flex;gap:0;margin:4px 0 26px}
.step{flex:1;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:11px;left:-50%;width:100%;height:1.5px;background:var(--hairline-2)}
.step:first-child::before{display:none}
.step.done::before{background:var(--ok)}
.step .s-dot{position:relative;z-index:1;width:22px;height:22px;border-radius:50%;background:var(--card);border:1.5px solid var(--hairline-2);
  display:inline-grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--text-4)}
.step.active .s-dot{border-color:var(--accent);color:var(--accent)}
.step.done .s-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.step .s-l{font-size:11px;font-weight:600;color:var(--text-4);margin-top:6px}
.step.active .s-l{color:var(--text)}

/* ═══ busca global ═══ */
.search-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.3);z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity var(--d1)}
.search-panel{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);z-index:var(--z-modal);background:var(--card);
  box-shadow:var(--shadow-pop);transform:translateX(100%);transition:transform var(--d2) var(--ease);display:flex;flex-direction:column}
body.search-open .search-backdrop{opacity:1;pointer-events:auto}
body.search-open .search-panel{transform:translateX(0)}
.search-head{padding:14px 16px;border-bottom:1px solid var(--hairline)}
.search-input{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:var(--r-m);background:var(--hover)}
.search-input input{flex:1;border:0;background:none;font-size:15.5px;color:var(--text);outline:none}
.search-body{flex:1;overflow-y:auto;padding:10px 14px 20px}
.search-hit{display:flex;align-items:center;gap:11px;width:100%;padding:10px 11px;border-radius:var(--r-s);text-align:left}
.search-hit:hover,.search-hit.sel{background:var(--hover)}
.search-hit .h-title{font-weight:600;font-size:13.5px}

<script>
/* ═══ NAVEGAÇÃO COM HASH — o voltar do navegador funciona ═══ */
function currentHash(){
  if(!S.module) return '#/';
  let h = '#/' + S.module + '/' + (S.moduleTab[S.module] || '');
  if(S.detail) h += '/' + S.detail.type + '/' + S.detail.id;
  return h;
}
function syncNav(){
  const h = currentHash();
  try{ if(location.hash !== h) location.hash = h; }catch(e){}
  document.getElementById('back-btn').hidden = h === '#/' || h === '' || h === '#';
}
function applyHash(h){
  const parts = (h || '#/').replace(/^#\/?/, '').split('/').filter(Boolean);
  if(!parts.length){ S.module = null; S.detail = null; renderHome(); return; }
  const m = MODULES.find(x => x.id === parts[0]);
  if(!m){ S.module = null; S.detail = null; renderHome(); return; }
  S.module = m.id;
  S.moduleTab[m.id] = parts[1] || m.tabs[0][0];
  S.detail = parts[2] ? { type:parts[2], id:parts[3] } : null;
  renderModule();
}
window.addEventListener('hashchange', () => applyHash(location.hash));

/* ═══ CHROME: contextos na topbar + tabs na subbar, sempre visíveis ═══ */
function renderChrome(){
  document.querySelectorAll('#ctxnav button').forEach(b =>
    b.classList.toggle('on', b.dataset.ctx === (S.module || 'home')));
  const sb = document.getElementById('subbar');
  if(!S.module){ sb.hidden = true; return; }
  const m = MODULES.find(x => x.id === S.module);
  const cur = S.moduleTab[m.id];
  sb.hidden = false;
  sb.innerHTML = `<span class="ctx-name">${m.name}</span>` + m.tabs.map(([t, label]) =>
    `<button class="subtab ${cur === t ? 'on' : ''}" onclick="setModuleTab('${t}')">${label}${tabCount(t)}</button>`).join('');
}

/* ═══ HOME — quase vazia. Cada linha trabalha. ═══ */
function renderHome(){
  const entregues = S.orders.filter(o => o.status === 'entregue');
  const vendas = entregues.reduce((s, o) => s + o.total, 0) + 1200;
  const ag = S.orders.filter(o => o.status === 'aguardando');
  const maior = ag.length ? Math.max(...ag.map(waitMin)) : 0;
  renderChrome();
  main.innerHTML = `
    <div class="hello-wrap">
      <div class="hello">Bom dia.</div>
      <p class="hello-sub">Sexta, 15 de agosto · Casa da Babá · caixa aberto desde <b>08h12</b></p>
    </div>
    <div class="now-line">
      <div class="now-item"><div class="n-v mono">${fmt$(vendas)}</div><div class="n-l">vendido hoje</div></div>
      <div class="now-item"><div class="n-v mono">${S.orders.length + 39}</div><div class="n-l">pedidos</div></div>
      <div class="now-item ${maior > 15 ? 'crit' : maior > 8 ? 'warn' : ''}"><div class="n-v mono">${maior} min</div><div class="n-l">maior espera na fila</div></div>
    </div>
    <div class="home-cta">
      <button class="btn btn-primary" onclick="openModule('operacao','novo-pedido')">${ico('plus', 14)} Novo pedido</button>
      <button class="btn btn-secondary" onclick="openModule('operacao','pedidos')">Ver a fila${ag.length ? ` · ${ag.length}` : ''}</button>
    </div>
    ${maior > 15 || S.pagar.some(p => p.venc === 'hoje' && p.status === 'pendente') ? `
    <div class="att-block">
      <span class="eyebrow">Pede atenção</span>
      <div style="margin-top:8px">
        ${maior > 15 ? `<div class="att-line"><span><b>#${ag.sort((a,b) => a.at - b.at)[0].n}</b> espera há ${maior} min — passou da meta de 15.</span><a class="a" href="#" onclick="openModule('operacao','pedidos');return false">Preparar →</a></div>` : ''}
        ${S.pagar.filter(p => p.venc === 'hoje' && p.status === 'pendente').map(p => `<div class="att-line"><span><b>${esc(p.desc.split('·')[0].trim())}</b> vence hoje · ${fmt$(p.valor)}</span><a class="a" href="#" onclick="openModule('financeiro','pagar');return false">Ver →</a></div>`).join('')}
        <div class="att-line"><span><b>6 un de pudim</b> vencem hoje · perda de R$ 24,60 se não agir.</span><a class="a" href="#" onclick="openModule('estoque','posicao');return false">Agir →</a></div>
      </div>
    </div>` : ''}
    <span class="eyebrow">Onde trabalhar</span>
    <div class="ctx-list" style="margin-top:8px">
      ${MODULES.map(m => `<button class="ctx-row" style="--tint:${m.tint}" onclick="openModule('${m.id}')">
        <span class="ctx-ico">${ico(m.icon, 17)}</span>
        <span><span class="ctx-name">${m.name}</span><br><span class="ctx-state">${m.state()}</span></span>
        <span class="ctx-arrow">›</span></button>`).join('')}
    </div>`;
  document.title = 'EasyStok [Homolog]';
  window.scrollTo(0, 0);
}

/* ═══ MÓDULO ═══ */
function openModule(id, tab){
  const m = MODULES.find(x => x.id === id);
  S.module = id;
  S.detail = null;
  S.moduleTab[id] = tab || S.moduleTab[id] || m.tabs[0][0];
  renderModule();
  syncNav();
}
function goHome(){ S.module = null; S.detail = null; renderHome(); syncNav(); }
function setModuleTab(t){ S.moduleTab[S.module] = t; S.detail = null; renderModule(); syncNav(); }
function renderModule(){
  const m = MODULES.find(x => x.id === S.module);
  const cur = S.moduleTab[m.id];
  renderChrome();
  /* detalhe de objeto: breadcrumb clicável + chrome intacto */
  if(S.detail){
    main.className = 'wrap';
    const isP = S.detail.type === 'pedido';
    const o = isP ? S.orders.find(x => x.id === S.detail.id) : null;
    const c = isP ? null : S.clientes.find(x => x.id === S.detail.id);
    main.innerHTML = `<div class="view-enter">
      <nav class="bc" aria-label="Trilha">
        <a href="#" onclick="goHome();return false">Hoje</a><span class="sep">›</span>
        <a href="#" onclick="closeDetail();return false">${m.name}</a><span class="sep">›</span>
        <b>${isP ? (o ? '#' + o.n : 'Pedido') : (c ? esc(c.nome) : 'Cliente')}</b>
      </nav>
      ${isP ? vPedido(S.detail.id) : vCliente(S.detail.id)}</div>`;
    document.title = `${isP ? 'Pedido' : 'Cliente'} · EasyStok [Homolog]`;
    window.scrollTo(0, 0);
    return;
  }
  const narrow = ['novo-pedido','novo-produto','entrada'].includes(cur);
  main.className = narrow ? 'wrap narrow' : 'wrap';
  main.innerHTML = `<div class="view-enter">${TABS[cur]()}</div>`;
  document.title = `${m.name} · EasyStok [Homolog]`;
  window.scrollTo(0, 0);
  if(cur === 'novo-pedido') initDraft();
  if(cur === 'entrada') initEntrada();
}
function tabCount(t){
  let n = null;
  if(t === 'pedidos') n = S.orders.filter(o => o.status !== 'entregue').length;
  if(t === 'pagar') n = S.pagar.filter(p => p.status === 'pendente').length;
  if(t === 'receber') n = S.receber.filter(r => r.status === 'pendente').length;
  if(t === 'atendimento') n = S.conversas.reduce((s, c) => s + c.unread, 0);
  if(t === 'avaliacoes') n = S.avaliacoes.filter(a => !a.respondida).length;
  return n ? `<span class="ct">${n}</span>` : '';
}
function rerender(){ if(S.module) renderModule(); else renderHome(); }

/* ═══ FILA DE PEDIDOS (calma) ═══ */
function tPedidos(){
  const rows = S.orders.filter(o => S.orderTab === 'andamento' ? o.status !== 'entregue' : S.orderTab === 'finalizados' ? o.status === 'entregue' : true)
    .sort((a, b) => b.n - a.n);
  return `<div class="chips-row">
      ${['andamento','finalizados','todos'].map(t => `<button class="chip ${S.orderTab === t ? 'on' : ''}" onclick="S.orderTab='${t}';rerender()">${{ andamento:'Em andamento', finalizados:'Finalizados', todos:'Todos' }[t]}</button>`).join('')}
    </div>
    <p class="tab-note">${rows.length} pedidos · atualizado agora</p>
    <div class="rows">
      ${rows.map(o => { const m = waitMin(o), sm = STATUS[o.status];
        return `<div class="row ${o.n === S.lastNew ? 'row-new' : ''}" role="button" tabindex="0" style="grid-template-columns:auto auto 1fr auto auto auto auto" onclick="openDetail('pedido','${o.id}')" onkeydown="if(event.key==='Enter')openDetail('pedido','${o.id}')">
          <span class="actip"><span class="row-num" style="font-weight:700">#${o.n}</span>
            <span class="actip-pop">
              ${sm.action ? `<button class="btn btn-dark" onclick="event.stopPropagation();advance('${o.id}')">${sm.action}</button>` : ''}
              <button class="btn btn-secondary" onclick="event.stopPropagation();toast('Cupom do #${o.n} na impressora')">Imprimir</button>
              <button class="btn btn-secondary" onclick="event.stopPropagation();openDetail('pedido','${o.id}')">Abrir</button>
            </span>
          </span>
          ${avatarFor(o.cliente)}
          <span><span class="row-main">${esc(o.cliente)}</span>
            <div class="row-sub">${o.items.map(i => `${i.q}× ${i.nome}`).join(' · ')}</div></span>
          <span class="pill pill-neutral">${o.canal}</span>
          <span class="row-num ${o.status === 'entregue' ? '' : waitClass(m)}">${o.status === 'entregue' ? '—' : m + ' min'}</span>
          <span class="row-num" style="font-weight:600">${fmt$(o.total)}</span>
          <span style="display:flex;gap:8px;align-items:center"><span class="pill ${sm.pill}">${sm.label}</span>
            ${sm.action ? `<button class="btn btn-dark btn-sm" onclick="event.stopPropagation();advance('${o.id}')">${sm.action}</button>` : ''}</span>
        </div>`; }).join('')}
    </div>
    ${rows.length ? '' : `<div class="empty"><div class="e-icon">${ico('check', 22)}</div><h2>Fila limpa</h2><p>Nenhum pedido nesse recorte.</p></div>`}`;
}
function advance(id){
  const o = S.orders.find(x => x.id === id);
  const next = STATUS[o.status].next;
  if(!next) return;
  o.status = next; o.at = Date.now();
  if(next === 'entregue') S.moves.unshift({ id:'mov_' + Math.random().toString(36).slice(2, 6), tipo:'venda', desc:`Pedido #${o.n} · ${o.cliente}`, valor:o.total, h:'agora', orderId:o.id, forma:o.pag });
  toast(`#${o.n} → ${STATUS[next].label}`);
  rerender();
}

/* ═══ CRIAR PEDIDO — o fluxo que já é bom, levado a sério ═══ */
function tNovoPedido(){
  const d = S.draft || (S.draft = { cliente:null, items:[], obs:'', canal:'' });
  return `
    <div class="draft-bar">
      <div><span class="d-k">Pedido em montagem</span><div class="d-t" id="d-title">${d.cliente ? esc(d.cliente.nome) : 'Escolha o cliente'}</div></div>
      <div class="d-total mono" id="d-total">${fmt$(draftTotal())}</div>
    </div>
    <div class="f-field">
      <label class="f-label">Cliente</label>
      ${d.cliente ? `
        <div class="row" style="grid-template-columns:1fr auto;border-top:0">
          <span><span class="row-main">${esc(d.cliente.nome)}</span><div class="row-sub">${d.cliente.tel} · costuma pedir ${esc(d.cliente.fav)}</div></span>
          <button class="btn btn-secondary btn-sm" onclick="S.draft.cliente=null;rerender()">Trocar</button>
        </div>` : `
        <div class="search-box">
          <span class="s-ico">${ico('search', 15)}</span>
          <input class="f-input big" id="client-q" placeholder="Quem pediu?" autocomplete="off" oninput="clientSearch(this.value)" onkeydown="clientKey(event)">
          <div id="client-sug"></div>
        </div>
        <div class="chips-row" style="margin-top:10px">
          ${S.clientes.slice(0, 3).map(c => `<button class="chip" onclick="pickClient('${c.id}')">${esc(c.nome.split(' ')[0])}</button>`).join('')}
          <button class="chip chip-add" onclick="toast('Abriria cadastro rápido de cliente')">${ico('plus', 11)} Novo cliente</button>
        </div>`}
    </div>
    <div class="f-field">
      <label class="f-label">Itens</label>
      <div class="search-box">
        <span class="s-ico">${ico('search', 15)}</span>
        <input class="f-input" id="item-q" placeholder="Adicionar do cardápio — digite “frango”…" autocomplete="off" oninput="itemSearch(this.value)" onkeydown="itemKey(event)">
        <div id="item-sug"></div>
      </div>
      <div id="draft-items" style="margin-top:4px">
        ${d.items.length ? d.items.map((it, i) => `
          <div class="order-item">
            <span class="item-thumb">${it.emoji || '🍽️'}</span>
            <span><span class="oi-name">${esc(it.nome)}</span><div class="oi-price mono">${fmt$(it.preco)}</div></span>
            <span class="qty">
              <button onclick="draftQty(${i}, -1)" aria-label="Diminuir">−</button>
              <span class="q-v">${it.q}</span>
              <button onclick="draftQty(${i}, 1)" aria-label="Aumentar">+</button>
            </span>
            <span class="row-num" style="min-width:70px;text-align:right;font-weight:600">${fmt$(it.preco * it.q)}</span>
            <button class="oi-x" aria-label="Remover" onclick="S.draft.items.splice(${i},1);rerender()">${ico('x', 13)}</button>
          </div>`).join('') :
          `<p class="f-hint" style="padding:8px 2px">Nada ainda. A busca acima acha pelo nome e adiciona com um toque.</p>`}
      </div>
    </div>
    <details class="more">
      <summary>Observação, canal, agendamento</summary>
      <div class="more-body">
        <div class="f-field"><label class="f-label">Observação</label>
          <textarea class="f-input" rows="2" placeholder="ex: sem cebola, retira 19h" onchange="S.draft.obs=this.value">${d.obs || ''}</textarea></div>
        <div class="f-field" style="margin-bottom:0"><label class="f-label">Canal</label>
          <div class="chips-row">${['Balcão','WhatsApp','iFood','Telefone'].map(c =>
            `<button class="chip ${d.canal === c ? 'on' : ''}" onclick="S.draft.canal='${c}';rerender()">${c}</button>`).join('')}</div></div>
      </div>
    </details>
    <div style="margin-top:22px">
      <button class="btn btn-primary btn-block" ${d.items.length && d.cliente ? '' : 'disabled'} onclick="saveDraft()">
        Salvar pedido · <span class="mono" style="font-variant-numeric:tabular-nums">${fmt$(draftTotal())}</span>
      </button>
      <p class="f-hint" style="text-align:center;margin-top:10px">cliente + 1 item é o mínimo · <kbd class="k">⌘↵</kbd> salva</p>
    </div>`;
}
function initDraft(){ if(!S.draft) S.draft = { cliente:null, items:[], obs:'', canal:'' }; }
function draftTotal(){ return (S.draft?.items || []).reduce((s, i) => s + i.preco * i.q, 0); }
function pickClient(id){ S.draft.cliente = S.clientes.find(c => c.id === id); rerender(); }
function clientSearch(q){
  const box = document.getElementById('client-sug');
  if(!q.trim()){ box.innerHTML = ''; return; }
  const hits = S.clientes.filter(c => c.nome.toLowerCase().includes(q.toLowerCase())).slice(0, 4);
  box.innerHTML = hits.length ? `<div class="suggest">${hits.map(c =>
    `<button onclick="pickClient('${c.id}')"><span style="font-weight:600">${esc(c.nome)}</span><span class="s-sub">${c.fav}</span></button>`).join('')}</div>` : '';
}
function clientKey(e){ if(e.key === 'Enter'){ e.preventDefault(); document.querySelector('#client-sug .suggest button')?.click(); } }
function itemSearch(q){
  const box = document.getElementById('item-sug');
  if(!q.trim()){ box.innerHTML = ''; return; }
  const hits = S.cardapio.filter(m => m.nome.toLowerCase().includes(q.toLowerCase())).slice(0, 5);
  box.innerHTML = hits.length ? `<div class="suggest">${hits.map(m =>
    `<button onclick="pickItem('${m.id}')"><span class="item-thumb" style="width:30px;height:30px;font-size:15px">${m.emoji}</span><span style="font-weight:600">${esc(m.nome)}</span><span class="s-sub mono">${fmt$(m.preco)}</span></button>`).join('')}</div>` : '';
}
function itemKey(e){ if(e.key === 'Enter'){ e.preventDefault(); document.querySelector('#item-sug .suggest button')?.click(); } }
function pickItem(id){
  const m = S.cardapio.find(x => x.id === id);
  const ex = S.draft.items.find(i => i.id === id);
  if(ex) ex.q++;
  else S.draft.items.push({ id, nome:m.nome, preco:m.preco, q:1, emoji:m.emoji });
  rerender();
  setTimeout(() => { const inp = document.getElementById('item-q'); if(inp){ inp.value = ''; inp.focus(); } }, 0);
}
function draftQty(i, d){
  const it = S.draft.items[i];
  it.q += d;
  if(it.q <= 0) S.draft.items.splice(i, 1);
  rerender();
  setTimeout(() => document.getElementById('item-q')?.focus(), 0);
}
let simN = 1045;
const NAMES = ['Lúcia Prado','Marcos Vinícius','Tati Nogueira','Rafa Pinto','Inês Duarte','Caio Moraes'];
function saveDraft(){
  const d = S.draft;
  if(!d.cliente || !d.items.length) return;
  const o = { id:'ped_' + Math.random().toString(36).slice(2, 7), n:simN++, cliente:d.cliente.nome,
    canal:d.canal || 'Balcão', total:draftTotal(), status:'aguardando', at:Date.now(), items:d.items.map(i => ({ nome:i.nome, q:i.q, p:i.preco })) };
  S.orders.push(o);
  S.draft = null;
  toast(`Pedido #${o.n} salvo · entrou na fila`);
  S.moduleTab['operacao'] = 'pedidos';
  S.orderTab = 'andamento';
  S.lastNew = o.n;
  renderModule();
  setTimeout(() => { S.lastNew = null; }, 600);
}
</script>
<script>
/* ═══ ESTOQUE: posição, entrada (stepper), produtos, novo produto ═══ */
function tPosicao(){
  return `<p class="tab-note">${S.stock.length} itens · ${S.stock.filter(s => s.qty < s.min).length} abaixo do mínimo</p>
    <div class="rows">
      ${S.stock.map(s => { const low = s.qty < s.min;
        return `<div class="row" role="button" tabindex="0" data-tip="Ver o insumo" style="grid-template-columns:1fr auto auto auto;cursor:pointer" onclick="peek('insumo','${s.id}')" onkeydown="if(event.key==='Enter')peek('insumo','${s.id}')">
          <span><span class="row-main">${esc(s.nome)}</span><div class="row-sub">${s.cat}</div></span>
          <span class="row-num" style="${low ? 'color:var(--crit);font-weight:700' : ''}">${String(s.qty).replace('.', ',')} ${s.un}</span>
          <span class="row-num" style="color:var(--text-3)">mín ${s.min} ${s.un}</span>
          ${low ? '<span class="pill pill-crit">repor</span>' : '<span class="pill pill-ok">ok</span>'}
        </div>`; }).join('')}
    </div>`;
}
function initEntrada(){ if(!S.entry) S.entry = { step:1, item:null, qty:'', custo:'', val:'' }; }
function tEntrada(){
  const e = S.entry || (S.entry = { step:1, item:null, qty:'', custo:'', val:'' });
  const steps = ['Produto','Quantidade','Confirmar'];
  return `<div class="steps">
      ${steps.map((s, i) => `<div class="step ${e.step > i + 1 ? 'done' : e.step === i + 1 ? 'active' : ''}">
        <span class="s-dot">${e.step > i + 1 ? '✓' : i + 1}</span><div class="s-l">${s}</div></div>`).join('')}
    </div>
    ${e.step === 1 ? `
      <div class="f-field"><label class="f-label">O que entrou?</label>
        <div class="search-box"><span class="s-ico">${ico('search', 15)}</span>
          <input class="f-input big" placeholder="Buscar por nome ou bipe o código…" oninput="entrySearch(this.value)" autocomplete="off">
          <div id="entry-sug"></div>
        </div>
        <p class="f-hint">Não achou? <a href="#" onclick="setModuleTab('novo-produto');return false">Cadastre rápido</a> e volte — a entrada espera.</p>
      </div>` : ''}
    ${e.step === 2 ? `
      <div class="row" style="grid-template-columns:1fr auto;border-top:0;margin-bottom:16px">
        <span><span class="row-main">${esc(e.item.nome)}</span><div class="row-sub">${e.item.cat} · em estoque: ${String(e.item.qty).replace('.', ',')} ${e.item.un}</div></span>
        <button class="btn btn-secondary btn-sm" onclick="S.entry.step=1;rerender()">Trocar</button>
      </div>
      <div class="f-grid2">
        <div class="f-field"><label class="f-label">Quantidade *</label>
          <input class="f-input big mono" type="number" min="0" step="any" value="${e.qty}" oninput="S.entry.qty=this.value" placeholder="0" id="entry-qty"></div>
        <div class="f-field"><label class="f-label">Custo unitário *</label>
          <input class="f-input big mono" type="number" min="0" step="0.01" value="${e.custo}" oninput="S.entry.custo=this.value" placeholder="${e.item.custo.toFixed(2)}" id="entry-custo"></div>
      </div>
      <div class="f-field"><label class="f-label">Validade (se tiver)</label>
        <input class="f-input" type="date" onchange="S.entry.val=this.value"></div>
      <button class="btn btn-dark btn-block" onclick="entryReview()">Revisar →</button>` : ''}
    ${e.step === 3 ? `
      <div style="border-top:1px solid var(--hairline)">
        <div class="dr-row"><span class="dr-k">Produto</span><span class="dr-v">${esc(e.item.nome)}</span></div>
        <div class="dr-row"><span class="dr-k">Entrada</span><span class="dr-v mono">+ ${esc(e.qty)} ${e.item.un}</span></div>
        <div class="dr-row"><span class="dr-k">Custo unitário</span><span class="dr-v mono">${fmt$(parseFloat(e.custo) || e.item.custo)}</span></div>
        <div class="dr-row"><span class="dr-k">Total da entrada</span><span class="dr-v mono">${fmt$((parseFloat(e.custo) || e.item.custo) * parseFloat(e.qty))}</span></div>
        <div class="dr-row"><span class="dr-k">Novo estoque</span><span class="dr-v mono">${String(e.item.qty + parseFloat(e.qty)).replace('.', ',')} ${e.item.un}</span></div>
      </div>
      <div style="display:flex;gap:10px;margin-top:20px">
        <button class="btn btn-secondary" style="flex:1;justify-content:center;height:46px;border-radius:var(--r-m)" onclick="S.entry.step=2;rerender()">Voltar</button>
        <button class="btn btn-primary" style="flex:2;justify-content:center;height:46px;border-radius:var(--r-m)" onclick="entrySave()">Confirmar entrada</button>
      </div>` : ''}`;
}
function entrySearch(q){
  const box = document.getElementById('entry-sug');
  if(!q.trim()){ box.innerHTML = ''; return; }
  const hits = S.stock.filter(s => s.nome.toLowerCase().includes(q.toLowerCase())).slice(0, 4);
  box.innerHTML = hits.length ? `<div class="suggest">${hits.map(s =>
    `<button onclick="S.entry.item=S.stock.find(x=>x.id==='${s.id}');S.entry.step=2;rerender()"><span style="font-weight:600">${esc(s.nome)}</span><span class="s-sub">${String(s.qty).replace('.', ',')} ${s.un}</span></button>`).join('')}</div>` : '';
}
function entryReview(){
  const e = S.entry;
  if(!parseFloat(e.qty)){ toast('Informe a quantidade'); return; }
  e.step = 3; rerender();
}
function entrySave(){
  const e = S.entry;
  e.item.qty += parseFloat(e.qty);
  if(parseFloat(e.custo)) e.item.custo = parseFloat(e.custo);
  S.stockMoves.unshift({ id:'sm_' + Math.random().toString(36).slice(2, 5), tipo:'entrada', item:e.item.nome, qty:'+' + String(e.qty).replace('.', ',') + ' ' + e.item.un, h:'agora', autor:'Felipe', motivo:'Entrada manual' });
  toast(`Entrada confirmada: ${esc(e.item.nome)} agora tem ${String(e.item.qty).replace('.', ',')} ${e.item.un}`);
  S.entry = null;
  S.moduleTab['estoque'] = 'posicao';
  renderModule();
}
function tProdutos(){
  return `<p class="tab-note">${S.produtos.length} produtos · margem calculada da ficha técnica</p>
    <div class="rows">
      ${S.produtos.map(p => { const mg = Math.round((p.preco - p.custo) / p.preco * 100);
        return `<div class="row" role="button" tabindex="0" data-tip="Ver o produto" style="grid-template-columns:auto 1fr auto auto auto;cursor:pointer" onclick="peek('produto','${p.id}')" onkeydown="if(event.key==='Enter')peek('produto','${p.id}')">
          <span class="item-thumb">${p.emoji || '🍽️'}</span>

          <span class="row-num">${fmt$(p.preco)}</span>

function tNovoProduto(){
  return `
    <p class="tab-note" style="margin:0 0 18px">O essencial primeiro. O resto fica em detalhes — e a margem aparece enquanto você digita.</p>
    <div class="f-field"><label class="f-label">Nome *</label>
      <input class="f-input big" id="np-nome" placeholder="ex: Marmita de frango grelhado" autocomplete="off"></div>
    <div class="f-grid2">
      <div class="f-field"><label class="f-label">Preço de venda *</label>
        <input class="f-input mono" id="np-preco" type="number" min="0" step="0.01" placeholder="0,00" oninput="npMargem()"></div>
      <div class="f-field"><label class="f-label">Custo por unidade</label>
        <input class="f-input mono" id="np-custo" type="number" min="0" step="0.01" placeholder="0,00" oninput="npMargem()"></div>
    </div>

        <button class="chip chip-add" onclick="toast('Abriria nova categoria')">${ico('plus', 11)} Nova</button></div></div>
    <details class="more">
      <summary>Detalhes opcionais</summary>
      <div class="more-body">
        <div class="f-grid2">
          <div class="f-field"><label class="f-label">SKU</label><input class="f-input" placeholder="gerado automaticamente"></div>
          <div class="f-field"><label class="f-label">Código de barras</label><input class="f-input" placeholder="EAN-13"></div>
        </div>
        <div class="f-field"><label class="f-label">Estoque mínimo</label><input class="f-input mono" type="number" min="0" placeholder="0"></div>
        <div class="f-field" style="margin-bottom:0"><label class="f-label">Descrição do cardápio</label>
          <textarea class="f-input" rows="2" placeholder="Uma frase que vende: “frango grelhado na chapa, arroz soltinho e feijão preto”"></textarea></div>

      <button class="btn btn-primary btn-block" onclick="npSave()">Salvar produto</button>

function npMargem(){
  const p = parseFloat(document.getElementById('np-preco').value);
  const c = parseFloat(document.getElementById('np-custo').value);
  const box = document.getElementById('np-margem');
  if(p > 0 && c >= 0 && !isNaN(c)){
    const mg = (p - c) / p * 100;
    box.innerHTML = `<div style="display:flex;align-items:baseline;gap:10px;padding:12px 2px;margin-bottom:14px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline)">
      <span class="mono" style="font-size:22px;font-weight:600;color:${mg >= 55 ? 'var(--ok)' : mg >= 35 ? 'var(--warn)' : 'var(--crit)'}">${mg.toFixed(0)}%</span>
      <span style="font-size:13px;color:var(--text-3)">de margem · <b class="mono" style="color:var(--text)">${fmt$(p - c)}</b> por unidade</span></div>`;
  } else box.innerHTML = '';
}
function npSave(){
  const nome = document.getElementById('np-nome').value.trim();
  const preco = parseFloat(document.getElementById('np-preco').value);
  if(!nome || !preco){ toast('Nome e preço são o mínimo'); return; }
  S.produtos.push({ id:'prd_' + Math.random().toString(36).slice(2, 5), nome, cat:S.npCat || 'Marmitas', preco, custo:parseFloat(document.getElementById('np-custo').value) || 0 });
  S.cardapio.push({ id:'m' + Date.now(), nome, preco, cat:S.npCat || 'Marmitas' });
  toast(`${nome} cadastrado — já disponível no cardápio e nos pedidos`);
  S.moduleTab['estoque'] = 'produtos';
  renderModule();
}

/* ═══ CAIXA com drawer (Stripe) ═══ */
function tCaixa(){
  const vendas = S.moves.filter(m => m.tipo === 'venda').reduce((s, m) => s + m.valor, 0) + 1200;
  const saidas = S.moves.filter(m => m.tipo === 'saida').reduce((s, m) => s - m.valor, 0);
  const sangria = S.moves.filter(m => m.tipo === 'sangria').reduce((s, m) => s - m.valor, 0);
  const abertura = 200;
  const saldo = abertura + vendas - saidas - sangria;
  const tot = vendas + saidas + sangria;
  return `<div class="kpis">
      <div class="kpi"><div class="k-l">Saldo em caixa</div><div class="k-v">${fmt$(saldo)}</div><div class="k-d up">aberto desde 08h12</div></div>
      <div class="kpi"><div class="k-l">Entradas</div><div class="k-v">${fmt$(vendas)}</div><div class="k-d up">vendas entram sozinhas</div></div>
      <div class="kpi"><div class="k-l">Saídas + sangria</div><div class="k-v">${fmt$(saidas + sangria)}</div><div class="k-d flat">3 lançamentos manuais</div></div>
    </div>
    <div class="comp">
      <div style="width:${vendas / tot * 100}%;background:var(--ok)"></div><div style="width:${saidas / tot * 100}%;background:var(--warn)"></div><div style="width:${sangria / tot * 100}%;background:var(--crit)"></div>
    </div>
    <div class="legend" style="margin-bottom:26px">
      <div class="legend-row"><i style="background:var(--ok)"></i>Entradas<span class="v">${fmt$(vendas)}</span></div>
      <div class="legend-row"><i style="background:var(--warn)"></i>Saídas<span class="v">${fmt$(saidas)}</span></div>
      <div class="legend-row"><i style="background:var(--crit)"></i>Sangria<span class="v">${fmt$(sangria)}</span></div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">
      <span class="eyebrow">Movimentos de hoje</span>
      <span style="font-size:12px;color:var(--text-4)">atualizado agora</span>
    </div>
    <div class="rows">
      ${S.moves.map(m => `<button class="row" style="grid-template-columns:auto 1fr auto auto;width:100%;text-align:left" onclick="openMove('${m.id}')">
        <span class="pill ${m.tipo === 'venda' ? 'pill-ok' : m.tipo === 'abertura' ? 'pill-neutral' : m.tipo === 'sangria' ? 'pill-crit' : 'pill-warn'}">${m.tipo}</span>
        <span><span class="row-main" style="font-weight:600">${esc(m.desc)}</span><div class="row-sub">${m.h}</div></span>
        <span class="row-num" style="font-weight:600;color:${m.valor >= 0 ? 'var(--ok)' : 'var(--crit)'}">${m.valor >= 0 ? '+' : ''}${fmt$(m.valor)}</span>
        <span style="color:var(--text-4)">›</span>
      </button>`).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:22px">
      <button class="btn btn-secondary" onclick="toast('Abriria lançamento manual')">${ico('plus', 13)} Lançamento</button>
      <button class="btn btn-dark" onclick="toast('Abriria fechamento com conferência de valores')">Fechar o dia</button>
    </div>`;
}
function openMove(id){
  const m = S.moves.find(x => x.id === id);
  openDrawer(`
    <div class="drawer-head"><h2>${esc(m.desc)}</h2><button class="icon-btn" onclick="closeDrawer()">${ico('x', 15)}</button></div>
    <div class="drawer-body">
      <div style="font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;color:${m.valor >= 0 ? 'var(--ok)' : 'var(--crit)'};margin-bottom:18px">${m.valor >= 0 ? '+' : ''}${fmt$(m.valor)}</div>
      <div class="dr-row"><span class="dr-k">Tipo</span><span class="dr-v">${m.tipo}</span></div>
      <div class="dr-row"><span class="dr-k">Horário</span><span class="dr-v">${m.h}</span></div>
      <div class="dr-row"><span class="dr-k">Identificador</span><span class="dr-v mono" style="font-size:12px">${m.id} <a href="#" onclick="copyId('${m.id}');return false">copiar</a></span></div>
      <div class="dr-row"><span class="dr-k">Origem</span><span class="dr-v">${m.tipo === 'venda' ? 'Automática · pedido entregue' : 'Manual · operador'}</span></div>
      <div class="dr-row"><span class="dr-k">Caixa</span><span class="dr-v">Loja Centro · aberto 08h12</span></div>
      <div style="display:flex;gap:10px;margin-top:24px">

      </div>
    </div>`);
}

/* ═══ CONTAS a pagar/receber (Stripe: lista + drawer) ═══ */
function tContas(tipo){
  const data = tipo === 'receber' ? S.receber : S.pagar;
  const isR = tipo === 'receber';
  const pend = data.filter(c => c.status === 'pendente');
  return `<div class="kpis">
      <div class="kpi"><div class="k-l">${isR ? 'A receber' : 'A pagar'}</div><div class="k-v">${fmt$(pend.reduce((s, c) => s + c.valor, 0))}</div><div class="k-d flat">${pend.length} pendente${pend.length === 1 ? '' : 's'}</div></div>
      <div class="kpi"><div class="k-l">Vence hoje</div><div class="k-v">${fmt$(pend.filter(c => c.venc === 'hoje').reduce((s, c) => s + c.valor, 0))}</div><div class="k-d ${pend.some(c => c.venc === 'hoje') ? 'down' : 'up'}">${pend.some(c => c.venc === 'hoje') ? 'resolve antes de fechar' : 'nada urgente'}</div></div>
    </div>
    <div class="rows">
      ${data.map(c => `<button class="row" style="grid-template-columns:1fr auto auto auto;width:100%;text-align:left" onclick="openConta('${tipo}','${c.id}')">
        <span><span class="row-main">${esc(c.desc)}</span><div class="row-sub">${c.obs || 'sem observação'}</div></span>
        <span style="font-size:13px;${c.venc === 'hoje' && c.status === 'pendente' ? 'color:var(--crit);font-weight:700' : 'color:var(--text-3)'}">${c.venc}</span>
        <span class="row-num" style="font-weight:600">${fmt$(c.valor)}</span>
        <span class="pill ${c.status === 'pendente' ? 'pill-warn' : 'pill-ok'}">${c.status}</span>
      </button>`).join('')}
    </div>
    <div style="margin-top:22px"><button class="btn btn-secondary" onclick="toast('Abriria novo lançamento')">${ico('plus', 13)} Novo lançamento</button></div>`;
}
function openConta(tipo, id){
  const c = (tipo === 'receber' ? S.receber : S.pagar).find(x => x.id === id);
  const isR = tipo === 'receber';
  openDrawer(`
    <div class="drawer-head"><h2>${isR ? 'A receber' : 'A pagar'}</h2><button class="icon-btn" onclick="closeDrawer()">${ico('x', 15)}</button></div>
    <div class="drawer-body">
      <div style="font-size:15px;font-weight:700;margin-bottom:4px">${esc(c.desc)}</div>
      <div style="font-family:var(--font-mono);font-size:30px;font-weight:600;letter-spacing:-.02em;margin-bottom:18px">${fmt$(c.valor)}</div>
      <div class="dr-row"><span class="dr-k">Vencimento</span><span class="dr-v" style="${c.venc === 'hoje' ? 'color:var(--crit)' : ''}">${c.venc}</span></div>
      <div class="dr-row"><span class="dr-k">Status</span><span class="dr-v">${c.status}</span></div>
      <div class="dr-row"><span class="dr-k">Observação</span><span class="dr-v">${c.obs || '—'}</span></div>
      <div class="dr-row"><span class="dr-k">Identificador</span><span class="dr-v mono" style="font-size:12px">${c.id} <a href="#" onclick="copyId('${c.id}');return false">copiar</a></span></div>
      <div style="display:flex;gap:10px;margin-top:24px">
        ${c.status === 'pendente' ? `<button class="btn btn-primary" style="flex:1;justify-content:center" onclick="baixaConta('${tipo}','${id}')">${isR ? 'Confirmar recebimento' : 'Pagar agora'}</button>` : ''}
        <button class="btn btn-secondary" onclick="toast('Abriria edição')">Editar</button>
      </div>
    </div>`);
}
function baixaConta(tipo, id){
  const c = (tipo === 'receber' ? S.receber : S.pagar).find(x => x.id === id);
  c.status = tipo === 'receber' ? 'recebido' : 'pago';
  closeDrawer();
  toast(`${tipo === 'receber' ? 'Recebimento' : 'Pagamento'} confirmado · ${fmt$(c.valor)}`);
  rerender();
}

/* ═══ COMPRAS / GESTÃO (leves) ═══ */

}

/* lazy de propósito: algumas tabs vivem em scripts carregados depois deste;
   resolver na chamada evita ReferenceError na avaliação do objeto */
const TABS = {

/* edição rica */
.drawer.wide{width:min(520px,100vw)}
.f-section{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4);margin:20px 0 12px}
.f-section:first-child{margin-top:0}
.f-input.err{border-color:var(--crit);box-shadow:0 0 0 3px var(--crit-soft)}
.f-err{font-size:12px;color:var(--crit);margin-top:5px;font-weight:600}
.drawer-foot{position:sticky;bottom:0;display:flex;gap:10px;padding:14px 20px;background:var(--card);border-top:1px solid var(--hairline)}

/* ═══ DETALHE DE OBJETO (Stripe/Twilio) ═══ */
.detail-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.detail-head .d-title{font-size:26px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.detail-head .d-sub{font-size:13px;color:var(--text-3);margin-top:4px}
.detail-head .d-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--text-3);margin-bottom:14px}
.back-link:hover{color:var(--text)}
.id-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--text-4);
  background:var(--hover);border-radius:var(--r-s);padding:3px 8px}
.id-chip button{color:var(--text-4);display:grid;place-items:center;width:16px;height:16px;border-radius:4px}
.id-chip button:hover{background:var(--pressed);color:var(--text)}
.timeline{display:flex;margin:20px 0 26px}
.tl-step{flex:1;position:relative;text-align:center}
.tl-step::before{content:"";position:absolute;top:10px;left:-50%;width:100%;height:2px;background:var(--hairline-2)}
.tl-step:first-child::before{display:none}
.tl-step.done::before{background:var(--ok)}
.tl-dot{position:relative;z-index:1;width:21px;height:21px;border-radius:50%;background:var(--card);border:2px solid var(--hairline-2);
  display:inline-grid;place-items:center;font-size:10px;font-weight:800;color:var(--text-4)}
.tl-step.done .tl-dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tl-step.now .tl-dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-l{font-size:11px;font-weight:600;color:var(--text-4);margin-top:6px}
.tl-t{font-size:10.5px;color:var(--text-4);font-family:var(--font-mono)}
.tl-step.done .tl-l,.tl-step.now .tl-l{color:var(--text)}
.d-section{border-top:1px solid var(--hairline);padding:16px 0}
.d-section>.eyebrow{display:block;margin-bottom:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;margin:6px 0 4px}
.stat .s-v{font-family:var(--font-mono);font-size:21px;font-weight:600;letter-spacing:-.02em}
.stat .s-l{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* ═══ CUPOM 80mm (preview de impressão fiel) ═══ */
.receipt{width:280px;margin:0 auto;background:#fff;color:#111;border-radius:4px;box-shadow:var(--shadow-pop);
  padding:18px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.55}
.receipt .r-center{text-align:center}
.receipt .r-title{font-size:13px;font-weight:700}
.receipt .r-line{border-top:1px dashed #999;margin:8px 0}
.receipt .r-row{display:flex;justify-content:space-between;gap:8px}
.receipt .r-big{font-size:15px;font-weight:700}
@media print{body *{visibility:hidden}.receipt,.receipt *{visibility:visible}.receipt{position:fixed;inset:0;box-shadow:none}}

/* ═══ PEEK — modal canônica de objeto (a mesma em qualquer lugar) ═══ */
.peek-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.32);z-index:calc(var(--z-modal) + 10);
  display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity var(--d1) var(--ease)}
.peek{width:min(460px,100%);max-height:82vh;overflow-y:auto;background:var(--card);border-radius:var(--r-xl);
  box-shadow:var(--shadow-pop);transform:scale(.96) translateY(10px);transition:transform var(--d2) cubic-bezier(.32,.72,0,1)}
body.peek-open .peek-backdrop{opacity:1;pointer-events:auto}
body.peek-open .peek{transform:none}
.peek-head{display:flex;align-items:center;gap:12px;padding:16px 18px 12px;position:sticky;top:0;background:var(--card);z-index:2}
.peek-head h2{font-size:16px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.peek-body{padding:0 18px 16px}
.peek-foot{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--hairline)}
.peek-back{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;color:var(--text-3)}
.peek-back:hover{background:var(--hover);color:var(--text)}

/* ═══ CONFIRMAÇÃO canônica ═══ */
.confirm-wrap{position:fixed;inset:0;background:rgba(20,20,25,.32);z-index:calc(var(--z-modal) + 20);display:grid;place-items:center;padding:24px;opacity:0;pointer-events:none;transition:opacity var(--d1)}
.confirm{width:min(380px,100%);background:var(--card);border-radius:var(--r-l);box-shadow:var(--shadow-pop);padding:22px;transform:scale(.96);transition:transform var(--d2) cubic-bezier(.32,.72,0,1)}
body.confirm-open .confirm-wrap{opacity:1;pointer-events:auto}
body.confirm-open .confirm{transform:none}
.confirm h3{font-size:16px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.confirm p{font-size:13.5px;color:var(--text-3);line-height:1.5}
.confirm .c-actions{display:flex;gap:10px;margin-top:18px}
.confirm .c-actions .btn{flex:1;justify-content:center}
.btn-danger{background:var(--crit);color:#fff}
.btn-danger:hover{filter:brightness(1.06)}

/* ═══ tooltip calmo ═══ */
[data-tip]{position:relative}
[data-tip]::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translate(-50%,3px);
  background:var(--text);color:var(--page);font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;
  opacity:0;pointer-events:none;transition:opacity var(--d1) var(--ease),transform var(--d1) var(--ease);z-index:700}
[data-tip]:hover::after,[data-tip]:focus-visible::after{opacity:1;transform:translate(-50%,0)}

/* ═══ funil CRM ═══ */
.funnel{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.fun-stage{display:grid;grid-template-columns:150px 1fr 64px;align-items:center;gap:14px}
.fun-stage .f-l{font-size:13px;font-weight:600}
.fun-stage .f-bar{height:30px;border-radius:8px;background:var(--hover);position:relative;overflow:hidden}
.fun-stage .f-fill{position:absolute;inset:0;border-radius:8px;background:color-mix(in srgb, var(--fc) 78%, transparent)}
.fun-stage .f-n{font-family:var(--font-mono);font-size:13px;font-weight:600;text-align:right}
.fun-conv{font-size:11.5px;color:var(--text-4);padding:2px 0 6px 164px}

/* ═══ atendimento omnichannel ═══ */
.inbox{display:grid;grid-template-columns:300px 1fr;border:1px solid var(--hairline);border-radius:var(--r-l);overflow:hidden;background:var(--card)}
.inbox-list{border-right:1px solid var(--hairline);overflow-y:auto;max-height:520px}
.inbox-item{display:flex;gap:10px;width:100%;padding:12px 14px;text-align:left;border-bottom:1px solid var(--hairline);transition:background var(--d1)}
.inbox-item:hover{background:var(--hover)}
.inbox-item.on{background:var(--accent-soft)}
.inbox-item .ii-name{font-size:13.5px;font-weight:600}
.inbox-item .ii-prev{font-size:12px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.chan-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:var(--r-pill)}
.chan-wa{background:#E7F8EE;color:#128C4B}.chan-ig{background:#FCE9F3;color:#C13584}.chan-if{background:var(--crit-soft);color:var(--crit)}
.chan-kt{background:#F3E8FD;color:#6B2D9B}.chan-st{background:#EDF1F9;color:#15388A}
.chat{display:flex;flex-direction:column;max-height:520px}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--hairline);display:flex;align-items:center;gap:10px}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:72%;padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.45}
.msg.in{align-self:flex-start;background:var(--hover);border-bottom-left-radius:5px}
.msg.out{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg .m-t{display:block;font-size:10px;opacity:.6;margin-top:3px}
.chat-input{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--hairline)}
.chat-input .f-input{flex:1;height:40px}

/* ═══ avaliações ═══ */
.stars{color:#F5A623;letter-spacing:2px;font-size:14px}
.review{display:flex;gap:12px;padding:13px 2px;border-bottom:1px solid var(--hairline)}
.review:last-child{border-bottom:0}

/* ═══ timeline CRM do cliente ═══ */
.crm-tl{position:relative;padding-left:22px;margin-top:6px}
.crm-tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1.5px;background:var(--hairline-2)}
.crm-ev{position:relative;padding:0 0 16px}
.crm-ev::before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);border:2px solid var(--evc,var(--text-4))}
.crm-ev .e-t{font-size:13px;font-weight:600;line-height:1.4}
.crm-ev .e-when{font-size:11px;color:var(--text-4);font-family:var(--font-mono)}
.crm-ev .e-desc{font-size:12.5px;color:var(--text-3);margin-top:2px;line-height:1.5}

/* ═══ motion Apple: overlays com spring suave ═══ */
.drawer{transition:transform var(--d2) cubic-bezier(.32,.72,0,1)}
.search-panel{transition:transform var(--d2) cubic-bezier(.32,.72,0,1)}
.view-enter{animation:fadeUp .34s cubic-bezier(.32,.72,0,1)}

/* ═══ ACTION TOOLTIP — hover com botões de ação ═══ */
.actip{position:relative;display:inline-block}
.actip-pop{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translate(-50%,4px);z-index:650;
  display:flex;gap:6px;background:var(--card);border-radius:var(--r-m);box-shadow:var(--shadow-pop);padding:6px;
  opacity:0;pointer-events:none;transition:opacity var(--d1) var(--ease),transform var(--d1) var(--ease);white-space:nowrap}
.actip:hover .actip-pop,.actip:focus-within .actip-pop{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.actip-pop .btn{height:27px;font-size:12px;padding:0 10px}

/* ═══ CENTRO DE EVENTOS + SIMULAR ═══ */
.ev-panel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:var(--z-modal);background:var(--card);
  border-left:1px solid var(--hairline);box-shadow:var(--shadow-pop);transform:translateX(100%);
  transition:transform var(--d2) cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column}
body.ev-open .ev-panel{transform:none}
.ev-head{display:flex;align-items:center;gap:10px;padding:15px 18px;border-bottom:1px solid var(--hairline)}
.ev-head h2{font-size:16px;font-weight:800;letter-spacing:-.02em;flex:1}
.ev-list{flex:1;overflow-y:auto;padding:10px 12px 20px}
.ev-item{display:flex;gap:11px;padding:11px 10px;border-radius:var(--r-m);border-bottom:1px solid var(--hairline)}
.ev-item:hover{background:var(--hover)}
.ev-item.unread{background:var(--accent-soft)}
.ev-ico{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:15px}
.ev-t{font-size:13px;font-weight:600;line-height:1.4}
.ev-when{font-size:10.5px;color:var(--text-4);font-family:var(--font-mono)}
.ev-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ev-actions .btn{height:26px;font-size:11.5px;padding:0 10px}
.sim-menu{position:absolute;top:44px;right:0;z-index:var(--z-popover);width:250px;background:var(--card);border-radius:var(--r-m);
  box-shadow:var(--shadow-pop);padding:7px;animation:fadeUp .16s var(--ease)}
.sim-menu .sm-k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text-4);padding:7px 10px 5px}
.sim-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-s);font-size:13px;text-align:left}
.sim-menu button:hover{background:var(--hover)}
.sim-menu button .sm-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* ═══ INTEGRAÇÕES ═══ */
.int-card{display:flex;gap:14px;padding:18px;background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-l);box-shadow:var(--shadow-card)}
.int-logo{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:15px;flex-shrink:0;color:#fff}
.int-name{font-size:14.5px;font-weight:800;letter-spacing:-.01em}
.int-desc{font-size:12.5px;color:var(--text-3);margin-top:2px;line-height:1.5}
.int-feats{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.int-feats span{font-size:11px;font-weight:600;background:var(--hover);color:var(--text-2);padding:3px 9px;border-radius:var(--r-pill)}

/* ═══ PRODUÇÃO ═══ */
.demand{background:var(--card);border:1px solid var(--hairline);border-left:3px solid var(--accent);border-radius:var(--r-l);padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-card)}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod-tile{background:var(--card);border:1px solid var(--hairline);border-radius:var(--r-l);padding:14px;text-align:center;transition:all var(--d1) var(--ease);cursor:pointer}
.prod-tile:hover{border-color:var(--border-2);box-shadow:var(--shadow-card)}
.prod-tile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.prod-tile .pt-emoji{font-size:30px}
.prod-tile .pt-name{font-size:13px;font-weight:700;margin-top:6px}
.prod-tile .pt-qty{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px}
.prod-tile .pt-qty button{width:26px;height:26px;border-radius:50%;background:var(--hover);font-weight:700}
.prod-tile .pt-qty button:hover{background:var(--pressed)}
.prod-tile .pt-qty .v{font-family:var(--font-mono);font-weight:600;min-width:24px}
.calc-row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--hairline);font-size:13.5px}
.calc-row:last-child{border-bottom:0}
.tag-ok{color:var(--ok);font-weight:700;font-size:12px}.tag-lack{color:var(--crit);font-weight:700;font-size:12px}

/* ═══ ETIQUETA com logo (impressão produção) ═══ */
.label-prev{width:250px;background:#fff;color:#111;border:1px solid #ccc;border-radius:6px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:10.5px;line-height:1.5}
.logo-mark{width:34px;height:34px;border-radius:8px;background:#111;color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.02em}
.receipt .logo-mark{margin:0 auto 6px}

/* ═══ TEMA CASA DA BABÁ (as cores do PWA: dark warm terracota) ═══ */
:root[data-theme="casa"]{
  --page:#131009; --card:#1D1712; --hover:#251D16; --pressed:#2E241B;
  --text:#F7F2E8; --text-2:#CFC5B4; --text-3:#94886F; --text-4:#6B6252;
  --hairline:#2E261D; --hairline-2:#3D3327;
  --accent:#E76845; --accent-hover:#F08A68; --accent-soft:rgba(231,104,69,.15); --accent-text:#F08A68;
  --ok:#4FBF9F; --ok-soft:rgba(79,191,159,.14); --warn:#F0B84A; --warn-soft:rgba(240,184,74,.14); --crit:#E05B4B; --crit-soft:rgba(224,91,75,.15);
  --shadow-card:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  --shadow-pop:0 4px 14px rgba(0,0,0,.45),0 16px 48px rgba(0,0,0,.5);
  --flash:rgba(79,191,159,.14);
}

/* ═══ PUSH — toast e evento no MESMO padrão, no topo, estilo iOS ═══ */
.push-zone{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:var(--z-toast);display:flex;flex-direction:column;gap:8px;width:min(400px,92vw);pointer-events:none}
.push{pointer-events:auto;display:flex;align-items:center;gap:11px;background:color-mix(in srgb, var(--card) 88%, transparent);
  backdrop-filter:blur(18px);border:1px solid var(--hairline);border-radius:18px;box-shadow:var(--shadow-pop);
  padding:11px 14px;cursor:pointer;animation:pushIn .45s cubic-bezier(.32,.72,0,1)}
.push.leaving{opacity:0;transform:translateY(-10px);transition:all .25s var(--ease)}
@keyframes pushIn{from{opacity:0;transform:translateY(-16px) scale(.96)}to{opacity:1;transform:none}}
.push .p-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;font-size:14px;background:var(--accent-soft)}
.push .p-title{font-size:13px;font-weight:700;letter-spacing:-.01em}
.push .p-sub{font-size:12px;color:var(--text-3);margin-top:1px}

/* ═══ NOTAS POST-IT ═══ */
.notes-wall{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.postit{width:170px;min-height:110px;background:#FFF3B8;color:#5A4A00;border-radius:4px 4px 14px 4px;padding:12px;
  box-shadow:0 3px 8px rgba(0,0,0,.12);transform:rotate(-1.2deg);position:relative;font-size:12.5px;line-height:1.45}
.postit:nth-child(2n){transform:rotate(1.1deg);background:#FFE89A}
.postit:nth-child(3n){transform:rotate(-.6deg);background:#FFF7CC}
.postit .pt-meta{font-size:10px;opacity:.65;margin-top:8px;font-family:var(--font-mono)}
.postit .pt-x{position:absolute;top:5px;right:7px;font-size:13px;opacity:.4}
.postit .pt-x:hover{opacity:1}
.postit-new{width:170px;min-height:110px;border:1.5px dashed var(--hairline-2);border-radius:4px 4px 14px 4px;padding:12px;
  display:flex;align-items:center;justify-content:center;color:var(--text-4);font-size:12.5px;transition:all var(--d1)}
.postit-new:hover{border-color:var(--accent);color:var(--accent-text)}
.postit-new textarea{width:100%;height:100%;border:0;background:none;resize:none;font:inherit;font-size:12.5px;color:var(--text);outline:none}

/* ═══ A11Y PANEL ═══ */
.a11y-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px solid var(--hairline)}
.a11y-row:last-child{border-bottom:0}
.a11y-row .a-l{font-size:14px;font-weight:600}
.a11y-row .a-d{font-size:12px;color:var(--text-3);margin-top:2px}
input[type="range"].a-slider{-webkit-appearance:none;width:150px;height:4px;border-radius:99px;background:var(--pressed)}
input[type="range"].a-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent);cursor:pointer}
:root[data-a11y-contrast="1"]{--hairline:#9AA0AC;--hairline-2:#6E7480}
:root[data-a11y-contrast="1"][data-theme="dark"],:root[data-a11y-contrast="1"][data-theme="casa"]{--hairline:#5A6170;--hairline-2:#7A8290}
:root[data-a11y-motion="1"] *{transition-duration:.01ms!important;animation-duration:.01ms!important}
:root[data-a11y-links="1"] a{text-decoration:underline}

/* ═══ DOSSIÊ no atendimento ═══ */
.chat-wrap{display:grid;grid-template-columns:300px 1fr 250px;border:1px solid var(--hairline);border-radius:var(--r-l);overflow:hidden;background:var(--card)}
.dossier{border-left:1px solid var(--hairline);overflow-y:auto;max-height:520px;padding:14px}
.dossier h4{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--text-4);margin:14px 0 6px}
.dossier h4:first-child{margin-top:0}
.meta-window{display:flex;align-items:center;gap:8px;padding:9px 12px;font-size:12px;font-weight:600;border-bottom:1px solid var(--hairline)}
.meta-window.open{background:var(--ok-soft);color:var(--ok)}
.meta-window.closing{background:var(--warn-soft);color:var(--warn)}
.meta-window.closed{background:var(--pressed);color:var(--text-3)}
.audit-row{font-size:11.5px;color:var(--text-3);padding:6px 0;border-bottom:1px dashed var(--hairline);font-family:var(--font-mono)}

/* ═══ v13: voltar + wayfinding ═══ */
.back-btn{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:var(--text-3);margin-right:2px;transition:background var(--d1)}
