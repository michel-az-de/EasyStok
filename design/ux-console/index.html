<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" data-density="comfort">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EasyStok — o ERP como ele deve ser (protótipo vivo)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════
   TOKENS — DS v6 oficial + camada semântica de uso (Twilio)
   Beleza = parcimônia: neutros fazem 95% da tela, cor só onde
   significa (ação primária, status, ativo).
   ══════════════════════════════════════════════════════════════ */
:root{
  --ink-950:#050B1B; --ink-900:#0A1530; --ink-800:#122042; --ink-700:#2A3556; --ink-600:#4A5470;
  --ink-500:#707892; --ink-400:#98A0B4; --ink-300:#C2C8D6; --ink-200:#DEE2EB; --ink-100:#ECEFF5; --ink-50:#F5F7FB;
  --navy-900:#06143A; --navy-800:#0A1F52; --navy-700:#0E2A6E; --navy-600:#15388A; --navy-500:#1E48A8; --navy-200:#BCC8E5; --navy-100:#DDE4F2; --navy-50:#EDF1F9;
  --orange-900:#7A2A05; --orange-800:#9F3706; --orange-700:#BF4307; --orange-600:#E85814; --orange-500:#F26B25; --orange-400:#F8884A; --orange-200:#FAC8AB; --orange-100:#FCDCC8; --orange-50:#FEEFE3;
  --ok-700:#0E6B3D; --ok-600:#18874E; --ok-200:#BFE0CC; --ok-50:#ECF7F0;
  --warn-700:#8A5A00; --warn-600:#B57A00; --warn-200:#F0DC9A; --warn-50:#FCF5E0;
  --crit-700:#8E2A1E; --crit-600:#C03B2A; --crit-200:#EFB7AD; --crit-50:#FBEAE6;
  --vio-700:#5B21B6; --vio-50:#F3EFFF;
  --font-sans:'Inter',system-ui,sans-serif; --font-mono:'JetBrains Mono',monospace;
  --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;
  --ease:cubic-bezier(.4,0,.2,1); --d1:150ms; --d2:250ms;
  --z-sticky:100; --z-modal:400; --z-popover:500; --z-toast:700;
}
:root[data-theme="light"]{
  --page:#F6F8FB; --card:#FFFFFF; --hover:#F4F6FA; --pressed:#ECEFF5;
  --text:#101935; --text-2:#3D4A6B; --text-3:#68738F; --text-4:#98A0B4;
  --border:#E6EAF1; --border-2:#D4DAE5;
  --accent:#E85814; --accent-hover:#BF4307; --accent-soft:#FDF0E7; --accent-text:#BF4307; --accent-ring:rgba(232,88,20,.32);
  --side-bg:linear-gradient(180deg,#081128 0%,#0A1735 100%);
  --side-text:#8B97B8; --side-hover:rgba(255,255,255,.055); --side-active:rgba(232,88,20,.18); --side-active-text:#FBA978; --side-line:rgba(255,255,255,.07);
  --shadow-1:0 1px 2px rgba(16,25,53,.05); --shadow-2:0 2px 8px rgba(16,25,53,.06),0 10px 28px rgba(16,25,53,.07); --shadow-3:0 6px 16px rgba(16,25,53,.12),0 20px 48px rgba(16,25,53,.14);
  --flash:rgba(24,135,78,.12);
}
:root[data-theme="dark"]{
  --page:#080E1C; --card:#0F1930; --hover:rgba(255,255,255,.04); --pressed:rgba(255,255,255,.075);
  --text:#EDF0F7; --text-2:#C3CADB; --text-3:#8B96AF; --text-4:#5E6880;
  --border:rgba(255,255,255,.075); --border-2:rgba(255,255,255,.14);
  --accent:#F26B25; --accent-hover:#F8884A; --accent-soft:rgba(232,88,20,.15); --accent-text:#F8884A; --accent-ring:rgba(242,107,37,.4);
  --side-bg:#060C1A; --side-text:#7C87A5; --side-hover:rgba(255,255,255,.05); --side-active:rgba(232,88,20,.2); --side-active-text:#FBA978; --side-line:rgba(255,255,255,.06);
  --shadow-1:0 1px 2px rgba(0,0,0,.4); --shadow-2:0 2px 8px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); --shadow-3:0 6px 16px rgba(0,0,0,.5),0 20px 48px rgba(0,0,0,.5);
  --flash:rgba(76,195,138,.14);
}
:root[data-density="comfort"]{ --row-h:54px; --pad-cell:13px 18px; --pad-card:20px; --gap:16px; --fs:14px; }
:root[data-density="compact"]{ --row-h:37px; --pad-cell:6px 14px; --pad-card:14px; --gap:10px; --fs:13px; }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--fs);line-height:1.5;color:var(--text);background:var(--page);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent-text);text-decoration:none} a:hover{text-decoration:underline}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
.btn:focus-visible,.icon-btn:focus-visible,.chip:focus-visible{outline-offset:-2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--text-4)}
.skip-link{position:fixed;top:-48px;left:16px;z-index:var(--z-toast);background:var(--card);color:var(--text);padding:8px 16px;border-radius:var(--r-sm);box-shadow:var(--shadow-2);transition:top var(--d2) var(--ease)}
.skip-link:focus-visible{top:12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes rowIn{from{opacity:0;transform:translateY(-9px);background:var(--flash)}to{opacity:1;transform:none}}
@keyframes flashBg{0%{background:var(--flash)}100%{background:transparent}}
.flash{animation:flashBg 1.2s var(--ease)}
.row-new{animation:rowIn .5s var(--ease)}
.view-enter{animation:fadeUp .3s var(--ease)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
</style>
<style>
/* ═══ SHELL — sidebar navy profunda (o contraste que faltava) ═══ */
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
.sidebar{display:flex;flex-direction:column;background:var(--side-bg);min-height:0;position:relative}
.side-brand{display:flex;align-items:center;gap:10px;padding:17px 18px;border-bottom:1px solid var(--side-line)}
.side-brand .name{font-size:15.5px;font-weight:800;letter-spacing:-.01em;color:#fff}
.side-brand .name span{color:var(--orange-500)}
.side-brand .env{margin-left:auto;font-size:9px;font-weight:800;letter-spacing:.1em;color:#F0DC9A;
  background:rgba(240,184,74,.12);border:1px solid rgba(240,184,74,.25);padding:2px 7px;border-radius:var(--r-pill);text-transform:uppercase}
.sidebar nav{flex:1;overflow-y:auto;padding:12px 10px;scrollbar-width:none}
.sidebar nav::-webkit-scrollbar{display:none}
.nav-label{font-size:9.5px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:#57638A;padding:16px 9px 5px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;height:31px;padding:0 9px;border-radius:var(--r-xs);
  color:var(--side-text);font-size:13px;font-weight:500;text-align:left;position:relative;
  transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.nav-item:hover{background:var(--side-hover);color:#DDE3F2}
.nav-item.active{background:var(--side-active);color:var(--side-active-text);font-weight:600}
.nav-item.active::before{content:"";position:absolute;left:-10px;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--orange-500)}
.nav-item svg{flex-shrink:0;opacity:.8}
.nav-item.active svg{opacity:1}
.nav-item .ct{margin-left:auto;font-size:10px;font-weight:700;font-family:var(--font-mono);background:rgba(255,255,255,.09);
  color:#B9C3DC;border-radius:var(--r-pill);padding:1px 7px;min-width:20px;text-align:center}
.nav-item.active .ct{background:rgba(232,88,20,.3);color:#FCDCC8}
.side-foot{border-top:1px solid var(--side-line);padding:10px}
.side-user{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:var(--r-sm);width:100%;text-align:left}
.side-user:hover{background:var(--side-hover)}
.side-user .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--orange-500),var(--orange-700));
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0}
.side-user .u-name{font-size:12.5px;font-weight:600;color:#DDE3F2}
.side-user .u-role{font-size:10.5px;color:#57638A}

/* ═══ MAIN ═══ */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:54px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 22px;
  background:var(--card);border-bottom:1px solid var(--border)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-3)}
.breadcrumb b{color:var(--text);font-weight:600}
.breadcrumb .sep{color:var(--text-4);font-size:11px}
.topbar .spacer{flex:1}
.search-trigger{display:flex;align-items:center;gap:9px;height:34px;width:250px;padding:0 12px;border-radius:var(--r-sm);
  background:var(--hover);border:1px solid var(--border);color:var(--text-3);font-size:13px;transition:border-color var(--d1) var(--ease)}
.search-trigger:hover{border-color:var(--border-2)}
.search-trigger kbd{margin-left:auto;font-family:var(--font-mono);font-size:10px;color:var(--text-4);
  border:1px solid var(--border);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:var(--card)}
.icon-btn{display:grid;place-items:center;width:33px;height:33px;border-radius:var(--r-sm);color:var(--text-3);
  position:relative;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.icon-btn:hover{background:var(--hover);color:var(--text)}
.icon-btn .dot{position:absolute;top:6px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 2px var(--card)}
.density-toggle{display:flex;gap:2px;background:var(--hover);border:1px solid var(--border);border-radius:var(--r-sm);padding:2px}
.density-toggle button{display:flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:var(--r-xs);
  font-size:12px;font-weight:600;color:var(--text-3);transition:all var(--d1) var(--ease)}
.density-toggle button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--shadow-1)}
.sim-btn{display:flex;align-items:center;gap:7px;height:32px;padding:0 13px;border-radius:var(--r-sm);font-size:12.5px;
  font-weight:700;background:var(--navy-50);color:var(--navy-700);border:1px solid var(--navy-100);transition:all var(--d1) var(--ease)}
.sim-btn:hover{border-color:var(--navy-500)}
:root[data-theme="dark"] .sim-btn{background:rgba(30,72,168,.16);color:#9DB8EC;border-color:rgba(30,72,168,.3)}
.content{flex:1;overflow-y:auto;padding:24px 30px 72px;scrollbar-width:thin}
.view{max-width:1180px;margin:0 auto}
.view[hidden]{display:none}

/* ═══ PAGE HEAD ═══ */
.page-head{position:sticky;top:-25px;z-index:var(--z-sticky);background:var(--page);margin:-25px -31px 18px;padding:20px 31px 0;border-bottom:1px solid var(--border)}
.page-head .row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.page-head h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.page-head .sub{font-size:13px;color:var(--text-3);margin-top:3px}
.tabs{display:flex;gap:2px;margin-top:14px}
.tab{padding:7px 12px;font-size:13px;font-weight:500;color:var(--text-3);border-bottom:2px solid transparent;transition:color var(--d1) var(--ease)}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent-text);font-weight:600;border-bottom-color:var(--accent)}
.tab .ct{font-family:var(--font-mono);font-size:10.5px;margin-left:5px;color:var(--text-4)}
.tab[aria-selected="true"] .ct{color:var(--accent-text)}

/* ═══ BOTÕES ═══ */
.btn{display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 13px;border-radius:var(--r-sm);
  font-size:13px;font-weight:600;transition:background var(--d1) var(--ease),border-color var(--d1) var(--ease),color var(--d1) var(--ease),transform var(--d1) var(--ease)}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:var(--card);border:1px solid var(--border-2);color:var(--text);box-shadow:var(--shadow-1)}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent-text)}
.btn-sm{height:28px;font-size:12px;padding:0 10px}
kbd.k{font-family:var(--font-mono);font-size:10px;border:1px solid var(--border-2);border-bottom-width:2px;
  border-radius:4px;padding:1px 5px;color:var(--text-4);background:var(--card)}
.btn-primary kbd.k{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.3);color:#fff}
</style>
<style>
/* ═══ KPI — limpo: sem tarja colorida; valor mono, delta em pill, sparkline sutil ═══ */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--gap);margin:18px 0 20px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--pad-card);
  transition:box-shadow var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.kpi:hover{box-shadow:var(--shadow-2);border-color:var(--border-2)}
.kpi .k-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-4)}
.kpi .k-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:25px;font-weight:600;letter-spacing:-.02em;margin-top:9px}
.kpi .k-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.k-delta{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:var(--r-pill)}
.k-delta.up{background:var(--ok-50);color:var(--ok-700)} .k-delta.down{background:var(--crit-50);color:var(--crit-700)}
.k-delta.flat{background:var(--warn-50);color:var(--warn-700)}
:root[data-theme="dark"] .k-delta.up{background:rgba(24,135,78,.15);color:#4CC38A}
:root[data-theme="dark"] .k-delta.down{background:rgba(192,59,42,.16);color:#EF9A8C}
:root[data-theme="dark"] .k-delta.flat{background:rgba(181,122,0,.16);color:#EFC75E}
.kpi .k-foot{display:flex;justify-content:space-between;align-items:center;margin-top:11px;padding-top:10px;border-top:1px solid var(--border);font-size:11px;color:var(--text-4)}
.kpi .k-foot a{font-size:11px;font-weight:600}
.info-i{display:grid;place-items:center;width:14px;height:14px;border-radius:50%;border:1px solid var(--border-2);font-size:9px;color:var(--text-4);cursor:help}

/* ═══ CHIPS + POPOVER ═══ */
.filter-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 11px;border-radius:var(--r-pill);font-size:12px;font-weight:600;transition:all var(--d1) var(--ease)}
.chip-add{border:1px dashed var(--border-2);color:var(--accent-text)}
.chip-add:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip-on{border:1px solid rgba(232,88,20,.4);background:var(--accent-soft);color:var(--accent-text);animation:fadeUp .2s var(--ease)}
.chip-on .lbl{font-weight:400;color:var(--text-4)}
.chip-on .x{display:grid;place-items:center;width:15px;height:15px;border-radius:50%}
.chip-on .x:hover{background:var(--accent);color:#fff}
.filter-clear{font-size:12px;font-weight:600;color:var(--accent-text)}
.result-count{font-size:12px;color:var(--text-3);margin:0 0 10px}
.popover{position:absolute;z-index:var(--z-popover);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-2);padding:14px;width:226px;animation:fadeUp .18s var(--ease)}
.popover h3{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);margin-bottom:10px}
.popover select{width:100%;height:33px;padding:0 8px;border:1px solid var(--border-2);border-radius:var(--r-xs);background:var(--card);color:var(--text);font:inherit;font-size:13px;margin-bottom:10px}
.popover .btn{width:100%;justify-content:center}

/* ═══ TABELA — refinada: hairlines, hover suave, mono tabular ═══ */
.table-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);overflow:auto;box-shadow:var(--shadow-1)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:var(--fs);min-width:680px}
thead th{position:sticky;top:0;background:var(--card);text-align:left;padding:9px 18px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--text-4);border-bottom:1px solid var(--border);z-index:2}
tbody td{padding:var(--pad-cell);height:var(--row-h);border-bottom:1px solid var(--border);vertical-align:middle;transition:padding var(--d2) var(--ease)}
tbody tr{transition:background var(--d1) var(--ease)}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
.cell-name{font-weight:600;color:var(--text)}
.cell-link{color:var(--accent-text);cursor:pointer}
.cell-id{display:flex;align-items:center;gap:5px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-4)}
:root[data-density="compact"] .cell-id{display:none}
.cell-sub{font-size:11.5px;color:var(--text-4);margin-top:1px}
:root[data-density="compact"] .cell-sub{display:none}
.copy-btn{display:grid;place-items:center;width:17px;height:17px;border-radius:4px;color:var(--text-4)}
.copy-btn:hover{background:var(--pressed);color:var(--text)}
.num-r{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.wait-fresh{color:var(--ok-700);font-weight:600}.wait-warn{color:var(--warn-700);font-weight:600}.wait-late{color:var(--crit-700);font-weight:700}
:root[data-theme="dark"] .wait-fresh{color:#4CC38A}:root[data-theme="dark"] .wait-warn{color:#EFC75E}:root[data-theme="dark"] .wait-late{color:#EF9A8C}

/* ═══ PILLS pastel ═══ */
.pill{display:inline-flex;align-items:center;gap:5px;height:21px;padding:0 9px;border-radius:var(--r-pill);font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.pill-ok{background:var(--ok-50);color:var(--ok-700)}.pill-warn{background:var(--warn-50);color:var(--warn-700)}
.pill-crit{background:var(--crit-50);color:var(--crit-700)}.pill-info{background:var(--navy-50);color:var(--navy-700)}
.pill-vio{background:var(--vio-50);color:var(--vio-700)}
.pill-neutral{background:var(--pressed);color:var(--text-3)}
:root[data-theme="dark"] .pill-ok{background:rgba(24,135,78,.15);color:#4CC38A}
:root[data-theme="dark"] .pill-warn{background:rgba(181,122,0,.16);color:#EFC75E}
:root[data-theme="dark"] .pill-crit{background:rgba(192,59,42,.16);color:#EF9A8C}
:root[data-theme="dark"] .pill-info{background:rgba(30,72,168,.22);color:#9DB8EC}
:root[data-theme="dark"] .pill-vio{background:rgba(91,33,182,.25);color:#C4B5FD}

/* ═══ EMPTY / SKELETON / BUSCA / GUIA / TOAST ═══ */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;animation:fadeUp .3s var(--ease)}
.empty .e-icon{width:50px;height:50px;border-radius:var(--r-md);background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);margin-bottom:14px}
.empty h2{font-size:15.5px;font-weight:700;margin-bottom:4px}
.empty p{max-width:400px;color:var(--text-3);font-size:13px}
.empty .e-actions{display:flex;gap:14px;align-items:center;margin-top:18px}
.skel{position:relative;overflow:hidden;background:var(--pressed);border-radius:var(--r-xs)}
.skel::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shim 1.3s infinite}
:root[data-theme="dark"] .skel::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent)}
@keyframes shim{to{transform:translateX(100%)}}
.skel-wrap{animation:fadeUp .2s var(--ease)}
.search-backdrop{position:fixed;inset:0;background:rgba(5,11,27,.4);z-index:var(--z-modal);opacity:0;pointer-events:none;transition:opacity var(--d1) var(--ease)}
.search-panel{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);z-index:var(--z-modal);background:var(--card);
  border-left:1px solid var(--border);box-shadow:var(--shadow-3);transform:translateX(100%);transition:transform var(--d2) var(--ease);display:flex;flex-direction:column}
body.search-open .search-backdrop{opacity:1;pointer-events:auto}
body.search-open .search-panel{transform:translateX(0)}
.search-head{padding:14px 16px;border-bottom:1px solid var(--border)}
.search-input{display:flex;align-items:center;gap:10px;height:42px;padding:0 13px;border-radius:var(--r-sm);background:var(--accent-soft);border:2px solid rgba(232,88,20,.45)}
.search-input input{flex:1;border:0;background:none;font:inherit;font-size:15px;color:var(--text);outline:none}
.search-input svg{color:var(--accent)}
.search-body{flex:1;overflow-y:auto;padding:10px 14px 20px}
.search-hit{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:var(--r-sm);text-align:left}
.search-hit:hover,.search-hit.sel{background:var(--hover)}
.search-hit.sel{box-shadow:inset 0 0 0 1px var(--border-2)}
.search-hit .h-ico{width:29px;height:29px;border-radius:var(--r-xs);background:var(--pressed);display:grid;place-items:center;color:var(--text-3);flex-shrink:0}
.search-hit .h-title{font-weight:600;font-size:13px}
.search-hit .h-path{font-size:11px;color:var(--text-4)}
.search-hit mark{background:transparent;color:var(--accent-text);font-weight:700}
.search-hit .enter{margin-left:auto;opacity:0;color:var(--text-4);font-size:10.5px}
.search-hit.sel .enter{opacity:1}
.guide{position:fixed;right:20px;bottom:20px;z-index:var(--z-popover);width:308px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-3);overflow:hidden;animation:fadeUp .3s var(--ease)}
.guide .g-head{display:flex;align-items:center;gap:9px;padding:12px 14px}
.guide .g-title{font-size:13px;font-weight:700;flex:1}
.guide .g-count{font-size:11px;color:var(--text-4);font-family:var(--font-mono)}
.progress{height:4px;background:var(--pressed)}
.progress .bar{height:100%;background:var(--accent);transition:width .4s var(--ease)}
.guide .g-list{padding:6px}
.g-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 9px;border-radius:var(--r-sm);text-align:left;font-size:12.5px;color:var(--text)}
.g-item:hover{background:var(--hover)}
.g-item .g-box{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border-2);display:grid;place-items:center;flex-shrink:0;color:#fff;font-size:10px}
.g-item.done{color:var(--text-4)}
.g-item.done .g-box{background:var(--ok-600);border-color:var(--ok-600)}
.g-item.locked{color:var(--text-4);cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:var(--pad-card)}
.card-title{font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.section{margin-top:24px}
.alert{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;border-radius:var(--r-md);background:var(--warn-50);border:1px solid var(--warn-200);font-size:13px;color:var(--warn-700);animation:fadeUp .3s var(--ease)}
:root[data-theme="dark"] .alert{background:rgba(181,122,0,.12);border-color:rgba(181,122,0,.3);color:#F0DC9A}
.hub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:var(--gap);margin-top:12px}
.hub-card{display:flex;gap:13px;padding:var(--pad-card);background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);text-align:left;transition:box-shadow var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.hub-card:hover{box-shadow:var(--shadow-2);border-color:rgba(232,88,20,.35)}
.hub-card:hover .hc-title{color:var(--accent-text)}
.hc-icon{width:35px;height:35px;border-radius:var(--r-sm);background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex-shrink:0}
.hc-title{font-size:13px;font-weight:600;display:block}
.hc-desc{font-size:12px;color:var(--text-3);margin-top:2px;line-height:1.45;display:block}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);z-index:var(--z-toast);background:var(--ink-900);color:#EFF2F8;
  padding:9px 16px;border-radius:var(--r-pill);font-size:13px;font-weight:500;box-shadow:var(--shadow-3);opacity:0;pointer-events:none;transition:opacity var(--d1) var(--ease),transform var(--d1) var(--ease)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ═══ KDS — cockpit de cozinha ═══ */
.kds-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:var(--gap)}
.kds-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:10px;transition:box-shadow var(--d2) var(--ease)}
.kds-card:hover{box-shadow:var(--shadow-2)}
.kds-card.late{border-color:rgba(192,59,42,.45);box-shadow:0 0 0 1px rgba(192,59,42,.2)}
.kds-top{display:flex;align-items:center;gap:8px}
.kds-num{font-size:17px;font-weight:800;letter-spacing:-.02em}
.kds-timer{margin-left:auto;font-family:var(--font-mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:var(--r-pill)}
.kds-items{font-size:13px;line-height:1.55;color:var(--text-2)}
.kds-items b{color:var(--text)}

/* ═══ CARDÁPIO ═══ */
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:var(--gap)}
.menu-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;transition:box-shadow var(--d2) var(--ease)}
.menu-card:hover{box-shadow:var(--shadow-2)}
.menu-cover{height:92px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,var(--accent-soft),var(--pressed))}
.menu-body{padding:13px 14px}
.menu-name{font-size:13.5px;font-weight:700}
.menu-price{font-family:var(--font-mono);font-size:13px;font-weight:600;color:var(--text-2);margin-top:2px}
.menu-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.switch{position:relative;width:34px;height:19px;border-radius:var(--r-pill);background:var(--border-2);transition:background var(--d1) var(--ease);flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:var(--shadow-1);transition:transform var(--d1) var(--ease)}
.switch[aria-checked="true"]{background:var(--ok-600)}
.switch[aria-checked="true"]::after{transform:translateX(15px)}
.env-banner{display:flex;align-items:center;justify-content:center;gap:12px;height:30px;flex-shrink:0;background:#0A1F52;color:#BCC8E5;font-size:11px;font-weight:500}
.env-banner strong{color:#fff;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.env-banner a{color:var(--orange-200);font-weight:700}
@media (max-width:960px){.app{grid-template-columns:1fr}.sidebar{display:none}}
</style>
</head>

  preparando:{ pill:'pill-info', label:'preparando', action:'Pronto ✓',   next:'pronto',     cls:'btn-secondary' },
  pronto:    { pill:'pill-ok',   label:'pronto',     action:'Entregar →', next:'entregue',   cls:'btn-secondary' },

};
const CHANNEL_PILL = { 'iFood':'pill-crit', 'Balcão':'pill-neutral', 'WhatsApp':'pill-info' };
const waitMin = o => Math.max(0, Math.round((Date.now() - o.at) / MIN));
const waitClass = m => m <= 8 ? 'wait-fresh' : m <= 15 ? 'wait-warn' : 'wait-late';
function pageHead(mod, title, sub, actions = ''){
  return `<div class="page-head"><div class="row">
    <div><span class="eyebrow">${mod}</span><h1>${title}</h1>${sub ? `<p class="sub">${sub}</p>` : ''}</div>
    <div style="display:flex;gap:8px">${actions}</div></div></div>`;
}
function emptyState(icon, title, desc, actions){
  return `<div class="empty"><div class="e-icon">${ico(icon, 24)}</div><h2>${title}</h2><p>${desc}</p>
    <div class="e-actions">${actions}</div></div>`;
}
let popEl = null;
function chipBar(ctx, defs){
  const chips = Object.entries(S.filters[ctx] || {});
  return `<div class="filter-bar">
    ${defs.map(d => `<button class="chip chip-add" onclick="openFilterPopover(event,'${ctx}','${d.key}')">${ico('plus', 11)} ${d.label}</button>`).join('')}
    ${chips.map(([k, v]) => { const d = defs.find(x => x.key === k);
      return `<button class="chip chip-on"><span><span class="lbl">${d.label}:</span> ${esc(v)}</span><span class="x" onclick="event.stopPropagation();delFilter('${ctx}','${k}')">×</span></button>`; }).join('')}
    ${chips.length ? `<button class="filter-clear" onclick="clearFilters('${ctx}')">Limpar filtros</button>` : ''}
  </div>`;
}
const FILTER_DEFS = {
  orders:[{ key:'canal', label:'Canal', options:['iFood','Balcão','WhatsApp'] }, { key:'status', label:'Status', options:['aguardando','preparando','pronto','entregue'] }],
  stock:[{ key:'cat', label:'Categoria', options:['Laticínios','Carnes','Grãos','Sobremesas','Confeitaria','Embalagens'] }, { key:'alerta', label:'Alerta', options:['abaixo do mínimo','vence em 3 dias'] }],
};
function openFilterPopover(ev, ctx, key){
  closePop();
  const def = FILTER_DEFS[ctx].find(d => d.key === key);
  popEl = document.createElement('div');
  popEl.className = 'popover';
  popEl.innerHTML = `<h3>Filtrar por: ${def.label}</h3>
    <select>${def.options.map(o => `<option>${o}</option>`).join('')}</select>
    <button class="btn btn-primary">Aplicar</button>`;
  document.body.appendChild(popEl);
  const r = ev.currentTarget.getBoundingClientRect();
  popEl.style.left = Math.min(r.left, innerWidth - 242) + 'px';
  popEl.style.top = (r.bottom + 6) + 'px';
  popEl.querySelector('button').onclick = () => {
    S.filters[ctx][key] = popEl.querySelector('select').value;
    closePop(); rerender();
  };
  setTimeout(() => document.addEventListener('click', outsidePop), 0);
}
function outsidePop(e){ if(popEl && !popEl.contains(e.target)) closePop(); }
function closePop(){ if(popEl){ popEl.remove(); popEl = null; document.removeEventListener('click', outsidePop); } }
function delFilter(ctx, k){ delete S.filters[ctx][k]; rerender(); }
function clearFilters(ctx){ S.filters[ctx] = {}; rerender(); toast('Filtros removidos'); }
function copyId(id){ navigator.clipboard?.writeText(id).catch(() => {}); toast('Copiado: ' + id); }
const idCell = id => `<div class="cell-id">${id} <button class="copy-btn" aria-label="Copiar ID" onclick="copyId('${id}')">${ico('copy', 11)}</button></div>`;

/* ═══ RENDERER GENÉRICO DE LISTA (padrão de tela do ERP) ═══ */
function tablePage({ mod, title, sub, actions, cols, rows, empty }){
  return `${pageHead(mod, title, sub, actions)}
    <div class="table-card"><table><thead><tr>${cols.map(c => `<th${c.r ? ' class="num-r"' : ''}>${c.l}</th>`).join('')}</tr></thead>
    <tbody>${rows.length ? rows.map(r => `<tr>${r.map((c, i) => `<td${cols[i].r ? ' class="num-r"' : ''}>${c}</td>`).join('')}</tr>`).join('') : ''}</tbody></table>
    ${rows.length ? '' : emptyState(empty.icon, empty.title, empty.desc, empty.actions)}</div>`;
}

    <div class="section"><span class="eyebrow">Próximas ações</span>
      <div class="hub-grid">
        <button class="hub-card" onclick="show('pedidos')"><span class="hc-icon">${ico('zap', 17)}</span><span><span class="hc-title">${aguardando} pedidos aguardando preparo</span><span class="hc-desc">Comece pelo mais antigo pra segurar o tempo de espera.</span></span></button>

      </div></div>`;
}

/* ═══ VIEW: PEDIDOS (viva) ═══ */
function vPedidos(){
  const f = S.filters.orders;
  const rows = S.orders.filter(o => {
    if(S.tab === 'andamento' && o.status === 'entregue') return false;
    if(S.tab === 'finalizados' && o.status !== 'entregue') return false;
    if(f.canal && o.canal !== f.canal) return false;
    if(f.status && o.status !== f.status) return false;
    return true;
  }).sort((a, b) => b.n - a.n);
  const counts = { andamento:S.orders.filter(o => o.status !== 'entregue').length, finalizados:S.orders.filter(o => o.status === 'entregue').length, todos:S.orders.length };
  return `<div class="page-head"><div class="row">
      <div><span class="eyebrow">Operação</span><h1>Pedidos</h1>
      <p class="sub">Fila viva: timers correm, ações movem o pedido, filtros filtram de verdade.</p></div>
      <button class="btn btn-primary" onclick="simulateOrder()">${ico('plus', 14)} Novo pedido <kbd class="k">n</kbd></button></div>
    <div class="tabs" role="tablist">${['andamento','finalizados','todos'].map(t =>
      `<button class="tab" role="tab" aria-selected="${S.tab === t}" onclick="S.tab='${t}';rerender()">${{ andamento:'Em andamento', finalizados:'Finalizados', todos:'Todos' }[t]} <span class="ct">${counts[t]}</span></button>`).join('')}</div></div>

      <tbody>${rows.map(o => { const m = waitMin(o), sm = STATUS_META[o.status];
        return `<tr class="${o.n === S.lastNew ? 'row-new' : ''}">
          <td><span class="cell-link" onclick="toast('Detalhe do pedido #${o.n}')">#${o.n}</span>${idCell(o.id)}</td>
          <td>${esc(o.cliente)}<div class="cell-sub">${esc(o.items)}</div></td>
          <td><span class="pill ${CHANNEL_PILL[o.canal]}">${o.canal}</span></td>

/* ═══ VIEW: POSIÇÃO DE ESTOQUE (viva, com filtros) ═══ */
function vEstoque(){
  const f = S.filters.stock;
  const rows = S.stock.filter(s => {
    if(f.cat && s.cat !== f.cat) return false;
    if(f.alerta === 'abaixo do mínimo' && !(s.min > 0 && s.qty < s.min)) return false;
    if(f.alerta === 'vence em 3 dias' && !(s.valN <= 3)) return false;
    return true;
  }).map(s => {
    const low = s.min > 0 && s.qty < s.min;
    const pill = low ? ['pill-crit','abaixo do mínimo'] : s.valN === 0 ? ['pill-crit','vence hoje'] : s.valN === 1 ? ['pill-warn','vence amanhã'] : ['pill-ok','ok'];
    return [`<span class="cell-name">${esc(s.nome)}</span>${idCell(s.id)}`, esc(s.cat),
      `<span class="mono" style="${low ? 'color:var(--crit-700);font-weight:700' : ''}">${String(s.qty).replace('.', ',')} ${s.un}</span>`,
      `<span class="mono">${s.min ? s.min + ' ' + s.un : '—'}</span>`, `<span class="mono">${fmt$(s.custo)}</span>`,
      s.val, `<span class="pill ${pill[0]}">${pill[1]}</span>`];
  });
  return `${pageHead('Produção e estoque', 'Posição de estoque', 'Alterne Confortável/Compacto na topbar: a tela inteira se adapta junto.',
      `<button class="btn btn-secondary" onclick="toast('Abriria entrada de estoque')">Dar entrada</button>

function vAnalises(){
  return `${pageHead('Gestão', 'Análises', 'O que vende, quando vende e o que pesa na margem.', '')}
    <div class="kpi-grid">
      <article class="kpi"><div class="k-label">Produto campeão</div><div class="k-value" style="font-size:19px;font-family:var(--font-sans);font-weight:700">Marmita de frango</div><div class="k-row"><span class="k-delta up">212 un na semana</span></div><div class="k-foot"><span>28% do faturamento</span></div></article>
      <article class="kpi"><div class="k-label">Horário de pico</div><div class="k-value" style="font-size:19px;font-family:var(--font-sans);font-weight:700">11h30 – 13h00</div><div class="k-row"><span class="k-delta flat">62% dos pedidos</span></div><div class="k-foot"><span>Seg a sex</span></div></article>
      <article class="kpi"><div class="k-label">Perda por validade</div><div class="k-value mono">R$ 218</div><div class="k-row"><span class="k-delta down">▼ 18% vs jul</span></div><div class="k-foot"><a href="#" onclick="show('validade');return false">Ver validade →</a></div></article>
    </div>
    <div class="card"><div class="card-title">Pedidos por dia da semana</div>
      <div style="display:flex;align-items:flex-end;gap:14px;height:130px;margin-top:16px">
        ${[38,52,47,61,58,74,41].map((v, i) => `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
          <span class="mono" style="font-size:10.5px;color:var(--text-4)">${v}</span>
          <div style="width:100%;max-width:44px;height:${v * 1.4}px;border-radius:6px 6px 3px 3px;background:${i === 5 ? 'var(--accent)' : 'var(--navy-100)'}"></div>
          <span style="font-size:10.5px;color:var(--text-4)">${['seg','ter','qua','qui','sex','sáb','dom'][i]}</span></div>`).join('')}
      </div></div>`;
}
function vSimples(titulo, mod, icon, desc){
  return `${pageHead(mod, titulo, desc, '')}<div class="card">
    ${emptyState(icon, titulo + ' pronto pra uso', 'Esta tela segue o mesmo padrão de lista do sistema: filtros por chips, tabela densa e estado vazio que ensina.', `<button class="btn btn-primary" onclick="toast('Ação principal de ${titulo}')">Começar</button>`)}</div>`;
}

/* ═══ REGISTRO DE VIEWS ═══ */
const VIEWS = {
  dashboard:{ mod:'Meu dia', page:'Dashboard', r:vDashboard },
  pedidos:{ mod:'Operação', page:'Pedidos', r:vPedidos },
  kds:{ mod:'Operação', page:'KDS Cozinha', r:vKds },
  caixa:{ mod:'Operação', page:'Caixa', r:vCaixa },
  clientes:{ mod:'Operação', page:'Clientes', r:vClientes },
  cardapio:{ mod:'Operação', page:'Cardápio', r:vCardapio },
  validade:{ mod:'Produção e estoque', page:'Validade', r:vValidade },
  estoque:{ mod:'Produção e estoque', page:'Posição', r:vEstoque },
  produtos:{ mod:'Produção e estoque', page:'Produtos', r:vProdutos },
  entradas:{ mod:'Produção e estoque', page:'Entradas', r:() => vSimples('Entradas', 'Produção e estoque', 'down', 'Histórico de tudo que entrou no estoque.') },
  saidas:{ mod:'Produção e estoque', page:'Saídas', r:() => vSimples('Saídas', 'Produção e estoque', 'up', 'Histórico de saídas, perdas e descartes.') },
  compras:{ mod:'Compras', page:'Pedidos de compra', r:vCompras },
  fornecedores:{ mod:'Compras', page:'Fornecedores', r:vFornecedores },
  financeiro:{ mod:'Financeiro', page:'Visão geral', r:vFinanceiro },
  receber:{ mod:'Financeiro', page:'Contas a receber', r:() => vContas('receber') },
  pagar:{ mod:'Financeiro', page:'Contas a pagar', r:() => vContas('pagar') },
  notas:{ mod:'Financeiro', page:'Notas fiscais', r:vNotas },
  analises:{ mod:'Gestão', page:'Análises', r:vAnalises },
  dispositivos:{ mod:'Administração', page:'Dispositivos', r:vDispositivos },
  usuarios:{ mod:'Administração', page:'Usuários', r:vUsuarios },
  config:{ mod:'Administração', page:'Configurações', r:vConfig },
};
</script>
<script>
/* ═══ NAVEGAÇÃO + SKELETON ═══ */
let currentView = 'dashboard';
function show(v, flash){
  if(!VIEWS[v]) return;
  currentView = v;
  renderNav(v);
  document.getElementById('bc-mod').textContent = VIEWS[v].mod;
  document.getElementById('bc-page').textContent = VIEWS[v].page;
  document.title = VIEWS[v].page + ' · EasyStok [Homolog]';
  main.innerHTML = `<div class="skel-wrap">
    <div class="skel" style="height:18px;width:150px;margin-bottom:14px"></div>
    <div class="skel" style="height:30px;width:52%;margin-bottom:20px"></div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px">
      <div class="skel" style="height:104px"></div><div class="skel" style="height:104px"></div><div class="skel" style="height:104px"></div></div>
    <div class="skel" style="height:280px"></div></div>`;
  main.scrollTop = 0;
  setTimeout(() => {
    main.innerHTML = `<section class="view view-enter">${VIEWS[v].r(flash)}</section>`;
  }, 380);
}
function rerender(flash){
  main.innerHTML = `<section class="view">${VIEWS[currentView].r(flash)}</section>`;
  renderNav(currentView);
}

/* ═══ FLUXO DE PEDIDO ═══ */
function advance(id){
  const o = S.orders.find(x => x.id === id);
  const next = STATUS_META[o.status].next;
  if(!next) return;
  o.status = next; o.at = Date.now();
  toast(`#${o.n} → ${STATUS_META[next].label}`);
  rerender(true);
}
const NAMES = ['Lúcia Prado','Marcos Vinícius','Tati Nogueira','Rafa Pinto','Inês Duarte','Caio Moraes'];
const CHANNELS = ['iFood','Balcão','WhatsApp'];
const ITEMS = ['1× Marmita frango · 1× Guaraná','2× Marmita carne','1× Feijoada · 1× Suco','2× Bolo de pote brigadeiro','1× Marmita fit · 1× Salada'];
let simN = 1045;
function simulateOrder(){
  const o = { id:'ped_' + Math.random().toString(36).slice(2, 7), n:simN++,
    cliente:NAMES[Math.floor(Math.random() * NAMES.length)], canal:CHANNELS[Math.floor(Math.random() * CHANNELS.length)],
    total:18 + Math.random() * 60, status:'aguardando', at:Date.now(), items:ITEMS[Math.floor(Math.random() * ITEMS.length)] };
  S.orders.push(o); S.tab = 'andamento'; S.lastNew = o.n;
  toast('🔔 Pedido #' + o.n + ' entrou · ' + o.canal);
  if(currentView === 'pedidos' || currentView === 'dashboard' || currentView === 'kds') rerender(true);
  else { renderNav(currentView); }
  setTimeout(() => { S.lastNew = null; }, 600);
}

/* ═══ BUSCA GLOBAL — viva, sobre telas + pedidos + clientes + estoque ═══ */
function searchIndex(){
  const telas = NAV.filter(n => n.type === 'item').map(n => ({ t:n.label, p:n.v === 'dashboard' ? 'Meu dia' : 'Telas', g:'Ir para', icon:n.icon, fn:() => show(n.v) }));
  const acoes = [
    { t:'Novo pedido', p:'Ações', g:'Ações', icon:'plus', fn:() => simulateOrder() },
    { t:'Fechar o caixa', p:'Ações > Caixa', g:'Ações', icon:'caixa', fn:() => show('caixa') },
    { t:'Cadastrar produto', p:'Ações > Produtos', g:'Ações', icon:'pkg', fn:() => show('produtos') },
    { t:'Imprimir etiquetas', p:'Ações > Validade', g:'Ações', icon:'print', fn:() => show('validade') },
  ];
  const pedidos = S.orders.map(o => ({ t:`Pedido #${o.n} · ${o.cliente}`, p:`Operação > Pedidos > ${o.canal} · ${STATUS_META[o.status].label}`, g:'Pedidos', icon:'zap', fn:() => { S.tab = 'todos'; show('pedidos'); } }));
  const clientes = S.clientes.map(c => ({ t:c.nome, p:`Operação > Clientes · ${c.pedidos} pedidos`, g:'Clientes', icon:'users', fn:() => show('clientes') }));
  const estoque = S.stock.map(s => ({ t:s.nome, p:`Produção > Posição > ${s.cat}`, g:'Estoque', icon:'box', fn:() => show('estoque') }));
  return [...acoes, ...telas, ...pedidos, ...clientes, ...estoque];
}
let selIdx = 0, curHits = [];
function openSearch(){ document.body.classList.add('search-open'); renderSearch(''); setTimeout(() => document.getElementById('search-input').focus(), 60); }
function closeSearch(){ document.body.classList.remove('search-open'); }
function mark(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0 || !q) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function hitHtml(h, q, i){
  return `<button class="search-hit ${i === selIdx ? 'sel' : ''}" data-i="${i}" onclick="runHit(${i})">
    <span class="h-ico">${ico(h.icon, 15)}</span>
    <span><span class="h-title">${mark(h.t, q)}</span><br><span class="h-path">${mark(h.p, q)}</span></span>
    <span class="enter">↵</span></button>`;
}
function renderSearch(q){
  selIdx = 0;
  const body = document.getElementById('search-body');
  if(!q){
    curHits = searchIndex().filter(i => i.g === 'Ações');
    body.innerHTML = '<div style="margin-top:8px"><span class="eyebrow">Atalhos rápidos</span>' +
      curHits.map((h, i) => hitHtml(h, '', i)).join('') +
      '<p style="font-size:11px;color:var(--text-4);padding:12px 4px;line-height:1.6">“maria” acha a cliente e o pedido dela · “frango” acha produto e insumo · ↑↓ navegam · Enter abre</p></div>';
    return;
  }
  curHits = searchIndex().filter(i => (i.t + ' ' + i.p).toLowerCase().includes(q.toLowerCase()));
  const groups = [...new Set(curHits.map(h => h.g))];
  let i = 0;
  body.innerHTML = `<p class="result-count" style="margin-top:8px">${curHits.length} resultado${curHits.length === 1 ? '' : 's'}</p>` +
    (groups.map(g => `<div style="margin-top:10px"><span class="eyebrow">${esc(g)}</span>` +
      curHits.filter(h => h.g === g).map(h => hitHtml(h, q, i++)).join('') + '</div>').join('')
    || '<p style="color:var(--text-3);padding:14px 4px;font-size:13px">Nada encontrado. Tente “pedido”, “frango”, “caixa”.</p>');
}
function runHit(i){ closeSearch(); curHits[i]?.fn?.(); }
document.getElementById('search-input').addEventListener('input', e => renderSearch(e.target.value.trim()));

/* ═══ DENSIDADE / TEMA / GUIA / TOAST ═══ */
function setDensity(d){
  document.documentElement.dataset.density = d;
  document.querySelectorAll('.density-toggle button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
  try{ localStorage.setItem('es-density', d); }catch(e){}
  toast(d === 'compact' ? 'Compacto: mais linhas por tela' : 'Confortável: mais respiro');
}
try{ const d = localStorage.getItem('es-density'); if(d) document.documentElement.dataset.density = d; }catch(e){}
document.querySelectorAll('.density-toggle button').forEach(b =>
  b.setAttribute('aria-pressed', b.dataset.d === document.documentElement.dataset.density));
function toggleTheme(){
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('es-theme', next); }catch(e){}
}
try{
  const t = localStorage.getItem('es-theme');
  if(t) document.documentElement.dataset.theme = t;
  else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
}catch(e){}
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}
function toggleGuide(){
  const l = document.getElementById('guide-list');
  const hidden = l.style.display === 'none';
  l.style.display = hidden ? '' : 'none';
  document.querySelector('#guide .progress').style.display = hidden ? '' : 'none';
}

/* ═══ TECLADO ═══ */
let chord = null;
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){ closeSearch(); closePop(); return; }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); return; }
  if(document.body.classList.contains('search-open')){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      selIdx = Math.max(0, Math.min(curHits.length - 1, selIdx + (e.key === 'ArrowDown' ? 1 : -1)));
      document.querySelectorAll('.search-hit').forEach(h => h.classList.toggle('sel', Number(h.dataset.i) === selIdx));
      document.querySelector(`.search-hit[data-i="${selIdx}"]`)?.scrollIntoView({ block:'nearest' });
    }
    if(e.key === 'Enter'){ e.preventDefault(); runHit(selIdx); }
    return;
  }
  if(e.target.matches('input,select,textarea')) return;
  if(chord === 'g'){
    const map = { d:'dashboard', p:'pedidos', e:'estoque', x:'caixa', c:'config', k:'kds' };
    if(map[e.key.toLowerCase()]) show(map[e.key.toLowerCase()]);
    chord = null; return;
  }
  if(e.key.toLowerCase() === 'g'){ chord = 'g'; setTimeout(() => chord = null, 900); }
  if(e.key.toLowerCase() === 'n') simulateOrder();
});

/* timers ao vivo */
setInterval(() => { if(['pedidos','kds'].includes(currentView)) rerender(); }, 30000);

/* boot */
show('dashboard');
</script>
</body>
</html>
