<script>
/* ═══ DRAWER ═══ */
function openDrawer(html){
  const d = document.getElementById('drawer');
  d.classList.remove('wide');
  d.innerHTML = html;
  document.body.classList.add('drawer-open');
}
function closeDrawer(){ document.body.classList.remove('drawer-open'); }

/* ═══ BUSCA GLOBAL ═══ */
function searchIndex(){
  const ctxs = MODULES.flatMap(m => [
    { t:m.name, p:'Contexto', g:'Ir para', fn:() => openModule(m.id) },
    ...m.tabs.map(([t, label]) => ({ t:label, p:m.name, g:'Telas', fn:() => openModule(m.id, t) })),
  ]);
  const acoes = [
    { t:'Novo pedido', p:'Ações', g:'Ações', fn:() => openModule('operacao', 'novo-pedido') },
    { t:'Dar entrada no estoque', p:'Estoque', g:'Ações', fn:() => openModule('estoque', 'entrada') },
    { t:'Cadastrar produto', p:'Estoque', g:'Ações', fn:() => openModule('estoque', 'novo-produto') },
    { t:'Fechar o caixa', p:'Operação > Caixa', g:'Ações', fn:() => openModule('operacao', 'caixa') },
  ];
  const pedidos = S.orders.map(o => ({ t:`Pedido #${o.n} · ${o.cliente}`, p:`Operação · ${STATUS[o.status].label}`, g:'Pedidos', fn:() => { S.orderTab = 'todos'; openModule('operacao', 'pedidos'); } }));
  const clientes = S.clientes.map(c => ({ t:c.nome, p:`Clientes · ${c.pedidos} pedidos`, g:'Clientes', fn:() => openModule('operacao', 'clientes') }));
  const insumos = S.stock.map(s => ({ t:s.nome, p:`Estoque > ${s.cat}`, g:'Estoque', fn:() => openModule('estoque', 'posicao') }));
  const produtos = S.produtos.map(p => ({ t:p.nome, p:`Produtos > ${p.cat}`, g:'Produtos', fn:() => openModule('estoque', 'produtos') }));
  return [...acoes, ...ctxs, ...pedidos, ...clientes, ...insumos, ...produtos];
}
let selIdx = 0, curHits = [];
function openSearch(){ document.body.classList.add('search-open'); renderSearch(''); setTimeout(() => document.getElementById('search-input').focus(), 60); }
function closeSearch(){ document.body.classList.remove('search-open'); }
function mark(text, q){
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0 || !q) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function renderSearch(q){
  selIdx = 0;
  const body = document.getElementById('search-body');
  if(!q){
    curHits = searchIndex().filter(i => i.g === 'Ações');
    body.innerHTML = '<div style="margin-top:8px"><span class="eyebrow">Atalhos</span>' +
      curHits.map((h, i) => hitHtml(h, '', i)).join('') +
      '<p style="font-size:11.5px;color:var(--text-4);padding:12px 4px;line-height:1.6">“maria” acha cliente e pedido · “frango” acha produto e insumo · Enter abre o primeiro</p></div>';
    return;
  }
  curHits = searchIndex().filter(i => (i.t + ' ' + i.p).toLowerCase().includes(q.toLowerCase()));
  const groups = [...new Set(curHits.map(h => h.g))];
  let i = 0;
  body.innerHTML = `<p style="font-size:12px;color:var(--text-3);margin:8px 2px 4px">${curHits.length} resultado${curHits.length === 1 ? '' : 's'}</p>` +
    (groups.map(g => `<div style="margin-top:10px"><span class="eyebrow">${esc(g)}</span>` +
      curHits.filter(h => h.g === g).map(h => hitHtml(h, q, i++)).join('') + '</div>').join('')
    || '<p style="color:var(--text-3);padding:14px 4px;font-size:13px">Nada encontrado.</p>');
}
function hitHtml(h, q, i){
  return `<button class="search-hit ${i === selIdx ? 'sel' : ''}" data-i="${i}" onclick="runHit(${i})">
    <span><span class="h-title">${mark(h.t, q)}</span><br><span class="h-path">${mark(h.p, q)}</span></span>
    <span class="enter">↵</span></button>`;
}
function runHit(i){ closeSearch(); curHits[i]?.fn?.(); }
document.getElementById('search-input').addEventListener('input', e => renderSearch(e.target.value.trim()));

/* ═══ DENSIDADE / TEMA / TOAST ═══ */
function setDensity(d){
  document.documentElement.dataset.density = d;
  document.querySelectorAll('.density-toggle button').forEach(b => b.setAttribute('aria-pressed', b.dataset.d === d));
  try{ localStorage.setItem('es-density', d); }catch(e){}
}
try{ const d = localStorage.getItem('es-density'); if(d) document.documentElement.dataset.density = d; }catch(e){}
document.querySelectorAll('.density-toggle button').forEach(b =>
  b.setAttribute('aria-pressed', (document.documentElement.dataset.density || 'comfort') === b.dataset.d));
function toggleTheme(){
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try{ localStorage.setItem('es-theme', next); }catch(e){}
}
try{
  const t = localStorage.getItem('es-theme');
  if(t) document.documentElement.dataset.theme = t;
  else if(matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
}catch(e){}
let tt;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400);
}
function copyId(id){ navigator.clipboard?.writeText(id).catch(() => {}); toast('Copiado: ' + id); }

/* ═══ TECLADO ═══ */
document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    if(document.body.classList.contains('confirm-open')){ closeConfirm(); return; }
    if(document.body.classList.contains('peek-open')){ peekBack(); return; }
    if(document.body.classList.contains('ev-open')){ toggleEvents(false); return; }
    if(document.body.classList.contains('search-open')){ closeSearch(); return; }
    if(document.body.classList.contains('drawer-open')){ closeDrawer(); return; }
    if(popEl){ closePop(); return; }
    if(S.detail){ closeDetail(); return; }
    if(S.module){ goHome(); return; }
    return;
  }
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); openSearch(); return; }
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
    if(S.moduleTab['operacao'] === 'novo-pedido' && S.module === 'operacao'){ e.preventDefault(); saveDraft(); }
    return;
  }
  if(document.body.classList.contains('search-open')){
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      selIdx = Math.max(0, Math.min(curHits.length - 1, selIdx + (e.key === 'ArrowDown' ? 1 : -1)));
      document.querySelectorAll('.search-hit').forEach(h => h.classList.toggle('sel', Number(h.dataset.i) === selIdx));
    }
    if(e.key === 'Enter'){ e.preventDefault(); runHit(selIdx); }
    return;
  }
  if(e.target instanceof Element && e.target.matches('input,select,textarea')) return;
  /* 1..7 = os 7 destinos da topbar, na ordem visual */
  const CTX_KEYS = ['home','operacao','estoque','compras','financeiro','clientes','gestao'];
  const ki = parseInt(e.key);
  if(ki >= 1 && ki <= CTX_KEYS.length){
    ki === 1 ? goHome() : openModule(CTX_KEYS[ki - 1]);
    return;
  }
});

/* popover genérico (não usado neste corte, mantido pro próximo) */
let popEl = null;
function closePop(){ if(popEl){ popEl.remove(); popEl = null; } }

/* timers ao vivo */
setInterval(() => { if(S.module && S.moduleTab[S.module] === 'pedidos') renderModule(); }, 30000);
</script>
<script>
/* ═══ DETALHE DE PEDIDO — timeline viva, vínculo com caixa, impressão ═══ */
function cancelPedido(id){
  const i = S.orders.findIndex(x => x.id === id);
  if(i < 0) return;
  const n = S.orders[i].n;
  S.orders.splice(i, 1);
  closeDetail();
  audit(`cancelou o pedido #${n} · itens voltaram ao estoque`);
  toast(`Pedido #${n} cancelado · itens de volta ao estoque`);
}
function openDetail(type, id){ S.detail = { type, id }; renderModule(); syncNav(); }
function closeDetail(){ S.detail = null; renderModule(); syncNav(); }
function idChip(id){ return `<span class="id-chip">${id} <button aria-label="Copiar" onclick="copyId('${id}')">${ico('copy', 10)}</button></span>`; }
const REL = m => { const min = waitMin({ at: m }); if(min < 1) return 'agora'; if(min < 60) return `há ${min} min`; const h = Math.floor(min/60); return h < 24 ? `há ${h} h` : 'ontem'; };

function vPedido(id){
  const o = S.orders.find(x => x.id === id);
  if(!o) return closeDetail();
  const sm = STATUS[o.status];
  const steps = ['aguardando','preparando','pronto','entregue'];
  const idx = steps.indexOf(o.status);
  const move = S.moves.find(m => m.orderId === o.id);
  return `
    <div class="detail-head">
      <div>
        <div class="d-title">#${o.n} <span class="pill ${sm.pill}">${sm.label}</span></div>
        <div class="d-sub">criado ${REL(o.at)} · ${o.canal} · ${idChip(o.id)}</div>
      </div>
      <div class="d-actions">
        <button class="btn btn-secondary" onclick="toast('Cupom enviado pra impressora')">${ico('print', 14)} Imprimir cupom</button>
        ${sm.action ? `<button class="btn btn-primary" onclick="advance('${o.id}')">${sm.action}</button>` : ''}
        ${o.status !== 'entregue' ? `<button class="btn btn-secondary" style="color:var(--crit)" onclick="confirmDlg({title:'Cancelar o pedido #${o.n}?',desc:'O pedido sai da fila e os itens voltam pro estoque. O cliente é avisado no ${o.canal}. Isso fica registrado na linha do tempo dele.',confirmLabel:'Sim, cancelar pedido',danger:true,onConfirm:() => cancelPedido('${o.id}')})">Cancelar</button>` : ''}
      </div>
    </div>

    <div class="timeline">
      ${steps.map((s, i) => `<div class="tl-step ${i < idx ? 'done' : i === idx ? (o.status === 'entregue' ? 'done' : 'now') : ''}">
        <span class="tl-dot">${i < idx || o.status === 'entregue' ? '✓' : i + 1}</span>
        <div class="tl-l">${s}</div>
        ${i <= idx ? `<div class="tl-t">${REL(o.at)}</div>` : ''}
      </div>`).join('')}
    </div>

    <div class="d-section"><span class="eyebrow">Itens · ${o.items.reduce((s, i) => s + i.q, 0)}</span>
      <div class="rows" style="border-top:0">
        ${o.items.map(it => { const prod = S.produtos.find(p => p.nome === it.nome);
          return `<div class="row" role="${prod ? 'button' : 'listitem'}" tabindex="${prod ? '0' : '-1'}" style="grid-template-columns:auto 1fr auto auto;${prod ? 'cursor:pointer' : ''}" ${prod ? `onclick="peek('produto','${prod.id}')" onkeydown="if(event.key==='Enter')peek('produto','${prod.id}')" data-tip="Ver o produto"` : ''}>
          <span class="item-thumb">${it.emoji || '🍽️'}</span>
          <span><span class="row-main">${esc(it.nome)}</span>${it.q > 1 ? `<div class="row-sub mono">${fmt$(it.p)} cada</div>` : ''}</span>
          <span class="row-num" style="color:var(--text-3)">${it.q}×</span>
          <span class="row-num" style="font-weight:600;min-width:70px;text-align:right">${fmt$(it.p * it.q)}</span>
        </div>`; }).join('')}
      </div>
      ${o.obs ? `<p class="f-hint" style="margin-top:10px">✎ ${esc(o.obs)}</p>` : ''}
    </div>

    <div class="d-section"><span class="eyebrow">Pagamento</span>
      <div class="dr-row" style="border-top:0"><span class="dr-k">Forma</span><span class="dr-v">${o.pag}</span></div>
      <div class="dr-row"><span class="dr-k">Total</span><span class="dr-v mono">${fmt$(o.total)}</span></div>
      <div class="dr-row"><span class="dr-k">No caixa</span><span class="dr-v">${move
        ? `<a href="#" onclick="closeDetail();openModule('operacao','caixa');setTimeout(()=>openMove('${move.id}'),80);return false">${move.id} · entrou às ${move.h}</a>`
        : 'entra automaticamente quando for entregue'}</span></div>
    </div>

    <div class="d-section"><span class="eyebrow">Cliente</span>
      <div class="row" style="grid-template-columns:auto 1fr auto;border-top:0">
        ${avatarFor(o.cliente)}
        <span><span class="row-main">${esc(o.cliente)}</span><div class="row-sub">cliente desde março</div></span>
        <button class="btn btn-secondary btn-sm" onclick="openClienteByName('${esc(o.cliente)}')">Ver cliente</button>
      </div>
    </div>`;
}
function openClienteByName(nome){
  const c = S.clientes.find(x => x.nome === nome);
  if(c){ S.detail = { type:'cliente', id:c.id }; S.moduleTab['operacao'] = 'clientes'; renderModule(); }
}

/* ═══ DETALHE DE CLIENTE + EDIÇÃO CALMA ═══ */
function vCliente(id){
  const c = S.clientes.find(x => x.id === id);
  if(!c) return closeDetail();
  const pedidos = S.orders.filter(o => o.cliente === c.nome).sort((a, b) => b.n - a.n);
  const gasto = pedidos.reduce((s, o) => s + o.total, 0) + c.pedidos * 22; // base histórica simulada
  const ticket = gasto / (c.pedidos + pedidos.length || 1);
  return `
    <div class="detail-head">
      <span class="avatar-sm" style="width:52px;height:52px;font-size:17px;background:${avatarColorOf(c.nome)}">${c.nome.split(' ').map(p => p[0]).slice(0, 2).join('')}</span>
      <div>
        <div class="d-title">${esc(c.nome)}</div>
        <div class="d-sub">${c.tel} · cliente desde mar/2026 · ${idChip(c.id)}</div>
      </div>
      <div class="d-actions">
        <button class="btn btn-secondary" onclick="toast('Abriria WhatsApp')">WhatsApp ↗</button>
        <button class="btn btn-secondary" onclick="editCliente('${c.id}')">Editar</button>
        <button class="btn btn-primary" onclick="S.draft={cliente:S.clientes.find(x=>x.id==='${c.id}'),items:[],obs:'',canal:''};closeDetail();openModule('operacao','novo-pedido')">${ico('plus', 13)} Novo pedido</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat"><div class="s-v">${c.pedidos + pedidos.length}</div><div class="s-l">pedidos</div></div>
      <div class="stat"><div class="s-v">${fmt$(gasto)}</div><div class="s-l">total gasto</div></div>
      <div class="stat"><div class="s-v">${fmt$(ticket)}</div><div class="s-l">ticket médio</div></div>
      <div class="stat"><div class="s-v" style="font-size:15px;font-family:var(--font-sans);font-weight:700">${esc(c.fav)}</div><div class="s-l">costuma pedir</div></div>
    </div>

    <div class="d-section" style="margin-top:18px"><span class="eyebrow">Histórico recente</span>
      ${pedidos.length ? `<div class="rows" style="border-top:0">${pedidos.map(o => `
        <button class="row" style="grid-template-columns:auto 1fr auto auto;width:100%;text-align:left" onclick="openDetail('pedido','${o.id}')">
          <span class="row-num" style="font-weight:700">#${o.n}</span>
          <span class="row-sub">${o.items.map(i => `${i.q}× ${i.nome}`).join(' · ')}</span>
          <span class="row-num">${fmt$(o.total)}</span>
          <span class="pill ${STATUS[o.status].pill}">${STATUS[o.status].label}</span>
        </button>`).join('')}</div>`
      : `<p class="f-hint">Nenhum pedido recente.</p>`}
    </div>

    <div class="d-section"><span class="eyebrow">Linha do tempo — tudo que já aconteceu</span>
      ${(S.timeline[c.id] || []).length ? `<div class="crm-tl">
        ${S.timeline[c.id].map(ev => `<div class="crm-ev" style="--evc:${ev.c}">
          <div class="e-when">${ev.when}</div>
          <div class="e-t">${esc(ev.t)}</div>
          <div class="e-desc">${esc(ev.desc)}</div>
        </div>`).join('')}</div>`
      : `<p class="f-hint">Sem trilha ainda — clientes novos constroem a linha do tempo a cada contato, pedido e avaliação.</p>`}
    </div>

    <div class="d-section"><span class="eyebrow">Notas internas · só a equipe vê</span>
      ${notasWall(c.id)}
    </div>

    <div class="d-section"><span class="eyebrow">Registro de alterações</span>
      ${auditRows()}
    </div>`;
}
/* ═══ EDITAR CLIENTE — drawer rico: máscara, validação, dirty state ═══ */
function editCliente(id){
  const c = S.clientes.find(x => x.id === id);
  S.editing = { id, orig:{ nome:c.nome, tel:c.tel, end:c.end || '', obs:c.obs || '' } };
  openDrawer(`
    <div class="drawer-head"><h2>Editar cliente</h2><button class="icon-btn" aria-label="Fechar" onclick="tryCloseEdit()">${ico('x', 15)}</button></div>
    <div class="drawer-body">
      <div style="display:flex;align-items:center;gap:13px;margin-bottom:6px">
        <span class="avatar-sm" id="ec-avatar" style="width:46px;height:46px;font-size:15px;background:${avatarColorOf(c.nome)}">${c.nome.split(' ').map(p => p[0]).slice(0, 2).join('')}</span>
        <div><div style="font-weight:700" id="ec-preview">${esc(c.nome)}</div>
        <div style="font-size:12px;color:var(--text-4)">cliente desde mar/2026 · ${c.pedidos} pedidos</div></div>
      </div>
      <div class="f-section">Identificação</div>
      <div class="f-field"><label class="f-label" for="ec-nome">Nome completo *</label>
        <input class="f-input" id="ec-nome" value="${esc(c.nome)}" oninput="ecChange()" autocomplete="off">
        <div class="f-err" id="ec-nome-err" hidden>Sem o nome não dá pra salvar.</div></div>
      <div class="f-section">Contato</div>
      <div class="f-field"><label class="f-label" for="ec-tel">Telefone / WhatsApp</label>
        <input class="f-input mono" id="ec-tel" value="${c.tel}" inputmode="numeric" oninput="ecTel(this)" placeholder="(11) 90000-0000">
        <div class="f-err" id="ec-tel-err" hidden>Telefone incompleto — DDD + número.</div>
        <div class="f-hint">É pra lá que vão as atualizações de pedido.</div></div>
      <div class="f-section">Entrega</div>
      <div class="f-field"><label class="f-label" for="ec-end">Endereço</label>
        <input class="f-input" id="ec-end" value="${esc(c.end || '')}" placeholder="Rua, número, complemento" oninput="ecChange()"></div>
      <div class="f-field"><label class="f-label" for="ec-obs">Observações</label>
        <textarea class="f-input" id="ec-obs" rows="2" placeholder="ex: portaria 24h, não tocar campainha" oninput="ecChange()">${esc(c.obs || '')}</textarea></div>
    </div>
    <div class="drawer-foot">
      <button class="btn btn-secondary" style="flex:1;justify-content:center" onclick="tryCloseEdit()">Cancelar</button>
      <button class="btn btn-primary" style="flex:2;justify-content:center" id="ec-save" disabled onclick="saveCliente('${id}')">Salvar alterações</button>
    </div>`);
  document.getElementById('drawer').classList.add('wide');
  setTimeout(() => { const el = document.getElementById('ec-nome'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }, 60);
}
function ecTel(inp){
  const d = inp.value.replace(/\D/g, '').slice(0, 11);
  inp.value = d.length <= 2 ? d : d.length <= 6 ? `(${d.slice(0,2)}) ${d.slice(2)}` : d.length <= 10 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;
  ecChange();
}
function ecChange(){
  const e = S.editing; if(!e) return;
  const nome = document.getElementById('ec-nome').value.trim();
  const tel = document.getElementById('ec-tel').value;
  const end = document.getElementById('ec-end').value;
  const obs = document.getElementById('ec-obs').value;
  const dirty = nome !== e.orig.nome || tel !== e.orig.tel || end !== e.orig.end || obs !== e.orig.obs;
  const nomeOk = nome.length > 0;
  const telOk = tel === '' || tel.replace(/\D/g, '').length >= 10;
  document.getElementById('ec-nome').classList.toggle('err', !nomeOk);
  document.getElementById('ec-nome-err').hidden = nomeOk;
  document.getElementById('ec-tel').classList.toggle('err', !telOk);
  document.getElementById('ec-tel-err').hidden = telOk;
  document.getElementById('ec-save').disabled = !(dirty && nomeOk && telOk);
  document.getElementById('ec-preview').textContent = nome || 'Sem nome';

  document.getElementById('ec-avatar').textContent = ini;
}
function tryCloseEdit(){
  const e = S.editing;

    document.getElementById('ec-end').value !== e.orig.end ||
    document.getElementById('ec-obs').value !== e.orig.obs);

  S.editing = null;

}

}

/* ═══ PEEK — a mesma modal pra qualquer objeto, em qualquer lugar ═══ */
let peekStack = [];
function peek(kind, id){
  peekStack.push({ kind, id });
  renderPeek();
}
function peekBack(){ peekStack.pop(); peekStack.length ? renderPeek() : closePeek(); }
function closePeek(){ peekStack = []; document.body.classList.remove('peek-open'); }
function renderPeek(){
  const top = peekStack[peekStack.length - 1];
  if(!top) return closePeek();
  let el = document.querySelector('.peek-backdrop');
  if(!el){
    el = document.createElement('div');
    el.className = 'peek-backdrop';
    el.innerHTML = '<div class="peek" role="dialog" aria-modal="true"></div>';
    el.addEventListener('click', e => { if(e.target === el) closePeek(); });
    document.body.appendChild(el);
  }
  const box = el.querySelector('.peek');
  box.innerHTML = peekContent(top.kind, top.id);
  document.body.classList.add('peek-open');
  setTimeout(() => box.querySelector('.peek-x, .peek-foot .btn')?.focus(), 80);
}
function peekShell(title, back, body, foot){
  return `<div class="peek-head">
      ${back ? `<button class="peek-back" aria-label="Voltar" onclick="peekBack()">‹</button>` : ''}
      <h2>${title}</h2>
      <button class="icon-btn peek-x" aria-label="Fechar" onclick="closePeek()">${ico('x', 14)}</button>
    </div>
    <div class="peek-body">${body}</div>
    ${foot ? `<div class="peek-foot">${foot}</div>` : ''}`;
}
function peekContent(kind, id){
  const back = peekStack.length > 1;
  if(kind === 'produto'){
    const p = S.produtos.find(x => x.id === id);
    if(!p) return peekShell('Produto', back, '<p class="f-hint">Produto não encontrado.</p>', '');
    const mg = Math.round((p.preco - p.custo) / p.preco * 100);
    const vendasSem = 38 + (id.charCodeAt(id.length - 1) % 5) * 9;
    const ficha = S.receitas[id] || [];
    const spark = [4,7,5,9,8,11,vendasSem/7|0];
    const max = Math.max(...spark);
    return peekShell(p.nome, back, `
      <div style="display:flex;align-items:center;gap:13px;margin-bottom:6px">
        <span class="item-thumb" style="width:52px;height:52px;font-size:26px">${p.emoji || '🍽️'}</span>
        <div><span class="pill pill-neutral">${p.cat}</span>
        <div class="f-hint" style="margin-top:5px">${vendasSem} un vendidas na semana</div></div>

/* ═══ CONFIRMAÇÃO canônica (formulários sensíveis + destrutivas) ═══ */
let confirmFn = null;
function confirmDlg({ title, desc, confirmLabel = 'Confirmar', danger = false, onConfirm }){
  confirmFn = onConfirm;
  let el = document.querySelector('.confirm-wrap');
  if(!el){
    el = document.createElement('div');
    el.className = 'confirm-wrap';
    el.innerHTML = '<div class="confirm" role="alertdialog" aria-modal="true"></div>';
    el.addEventListener('click', e => { if(e.target === el) closeConfirm(); });
    document.body.appendChild(el);
  }
  el.querySelector('.confirm').innerHTML = `
    <h3>${title}</h3><p>${desc}</p>
    <div class="c-actions">
      <button class="btn btn-secondary" onclick="closeConfirm()">Voltar</button>
      <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" id="confirm-go">${confirmLabel}</button>
    </div>`;
  document.body.classList.add('confirm-open');
  document.getElementById('confirm-go').onclick = () => { const fn = confirmFn; closeConfirm(); fn?.(); };
  setTimeout(() => document.getElementById('confirm-go')?.focus(), 80);
}
function closeConfirm(){ document.body.classList.remove('confirm-open'); confirmFn = null; }

/* ═══ CAIXA INTELIGENTE: Saldo (onde está o dinheiro) / Extrato (saldo acumulado) ═══ */
function tCaixa(){
  const seg = S.cashSeg || 'extrato';
  const vendas = S.moves.filter(m => m.tipo === 'venda').reduce((s, m) => s + m.valor, 0) + 1200;
  const saidas = S.moves.filter(m => m.tipo === 'saida').reduce((s, m) => s - m.valor, 0);
  const sangria = S.moves.filter(m => m.tipo === 'sangria').reduce((s, m) => s - m.valor, 0);
  const saldo = 200 + vendas - saidas - sangria;
  const segs = `<div class="chips-row" style="margin:0 0 18px">
    ${[['extrato','Extrato'],['saldo','Saldo']].map(([k, l]) => `<button class="chip ${seg === k ? 'on' : ''}" onclick="S.cashSeg='${k}';rerender()">${l}</button>`).join('')}
    <span style="flex:1"></span>
    <button class="btn btn-secondary btn-sm" onclick="toast('Abriria lançamento manual')">${ico('plus', 12)} Lançamento</button>
    <button class="btn btn-secondary btn-sm" data-tip="Imprime o resumo do dia na térmica" onclick="printFechamento()">${ico('print', 13)} Imprimir</button>
    <button class="btn btn-dark btn-sm" onclick="fechamentoFlow()">Fechar o dia</button>
  </div>`;
  if(seg === 'saldo'){
    const onde = [
      { l:'Gaveta (dinheiro físico)', v:200 + vendas * .10 - sangria, c:'var(--warn)' },
      { l:'Pix · conta PJ', v:vendas * .62, c:'var(--ok)' },
      { l:'Cartão · a compensar', v:vendas * .28, c:'var(--text-4)' },
      { l:'iFood · repasse de quinta', v:842.30, c:'var(--crit)' },
    ];
    const tot = onde.reduce((s, o) => s + o.v, 0);
    return segs + `
      <div class="kpis">
        <div class="kpi"><div class="k-l">Total visível</div><div class="k-v">${fmt$(tot)}</div><div class="k-d up">dinheiro + a caminho</div></div>
        <div class="kpi"><div class="k-l">Na gaveta agora</div><div class="k-v">${fmt$(onde[0].v)}</div><div class="k-d flat">confere no fechamento</div></div>
        <div class="kpi"><div class="k-l">A caminho</div><div class="k-v">${fmt$(onde[2].v + onde[3].v)}</div><div class="k-d flat">cartão + repasse iFood</div></div>
      </div>
      <span class="eyebrow">Onde está o dinheiro</span>
      <div class="comp" style="margin-top:12px">${onde.map(o => `<div style="width:${o.v / tot * 100}%;background:${o.c}"></div>`).join('')}</div>
      <div class="legend">${onde.map(o => `<div class="legend-row"><i style="background:${o.c}"></i>${o.l}<span class="v">${fmt$(o.v)}</span></div>`).join('')}</div>
      <p class="f-hint" style="margin-top:16px">O repasse do iFood já desconta a comissão de 27%. Cai quinta na conta PJ.</p>`;
  }
  /* Extrato: saldo acumulado por linha, do mais novo pro mais velho */
  const f = S.cashFilter || 'todos';
  const rows = S.moves.filter(m => f === 'todos' ? true : m.tipo === f);
  let running = 200; // abertura
  const chron = [...S.moves].reverse(); // cronológico
  const withBalance = chron.map(m => { running += m.valor; return { ...m, bal: running }; }).reverse();
  const vis = withBalance.filter(m => f === 'todos' ? true : m.tipo === f);
  return segs + `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div class="chips-row" style="margin:0">
        ${[['todos','Todos'],['venda','Vendas'],['saida','Saídas'],['sangria','Sangria'],['abertura','Abertura']].map(([k, l]) =>
          `<button class="chip ${f === k ? 'on' : ''}" onclick="S.cashFilter='${k}';rerender()">${l}</button>`).join('')}
      </div>
      <span style="font-size:12px;color:var(--text-4)">${vis.length} lançamentos · saldo após cada um →</span>
    </div>
    <div class="rows">
      ${vis.map(m => `<button class="row" style="grid-template-columns:auto 1fr auto auto auto;width:100%;text-align:left" onclick="openMove('${m.id}')">
        <span class="pill ${m.tipo === 'venda' ? 'pill-ok' : m.tipo === 'abertura' ? 'pill-neutral' : m.tipo === 'sangria' ? 'pill-crit' : 'pill-warn'}">${m.tipo}</span>
        <span><span class="row-main" style="font-weight:600">${esc(m.desc)}</span><div class="row-sub">${m.h}${m.forma ? ' · ' + m.forma : ''}</div></span>
        <span class="row-num" style="font-weight:600;color:${m.valor >= 0 ? 'var(--ok)' : 'var(--crit)'}">${m.valor >= 0 ? '+' : ''}${fmt$(m.valor)}</span>
        <span class="row-num" style="color:var(--text-4);min-width:90px;text-align:right">${fmt$(m.bal)}</span>
        <span style="color:var(--text-4)">›</span>
      </button>`).join('')}
    </div>`;
}

function toggleEvents(force){
  let el = document.querySelector('.ev-panel');

    el.setAttribute('aria-label', 'Eventos');

  document.body.classList.toggle('ev-open', open);
  if(open){ renderEvents(); setTimeout(() => el.querySelector('.icon-btn')?.focus(), 80); }
  syncBell();
}
function renderEvents(){
  const el = document.querySelector('.ev-panel');
  if(!el) return;
  el.innerHTML = `
    <div class="ev-head"><h2>Acontecendo agora</h2>
      <button class="btn btn-secondary btn-sm" onclick="S.eventos.forEach(e=>e.unread=false);renderEvents();syncBell()">Marcar tudo lido</button>

    </div>
    <div class="ev-list">
      ${S.eventos.length ? S.eventos.map(e => `
        <div class="ev-item ${e.unread ? 'unread' : ''}" data-ev="${e.id}">

<script>
/* ═══ PRODUÇÃO — a tela mais importante da operação (estudo do PWA) ═══ */
function demandaAberta(){
  /* agrega itens dos pedidos aguardando+preparando, como o PWA faz via SSE */
  const map = {};
  S.orders.filter(o => ['aguardando','preparando'].includes(o.status)).forEach(o =>
    o.items.forEach(i => { map[i.nome] = (map[i.nome] || 0) + i.q; }));
  return Object.entries(map).map(([nome, q]) => ({ nome, q }));
}
function tProducao(){
  const dem = demandaAberta();
  const plano = S.produtos.slice(0, 5);
  return `
    <div class="demand">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <b style="font-size:14px">Demanda dos pedidos abertos</b>
        <span style="font-size:12px;color:var(--text-3)">${S.orders.filter(o => ['aguardando','preparando'].includes(o.status)).length} pedidos · ao vivo</span>
      </div>
      <div class="chips-row" style="margin:10px 0 12px">
        ${dem.map(d => `<span class="chip" style="background:var(--hover);color:var(--text)"><b>${d.q}×</b> ${esc(d.nome)}</span>`).join('') || '<span class="f-hint">fila limpa</span>'}
      </div>
      <button class="btn btn-dark btn-sm" onclick="calcDaDemanda()">Conferir insumos da demanda</button>
    </div>

    <span class="eyebrow">Plano de hoje — tocar seleciona, registrar gera lote + etiqueta</span>
    <div class="prod-grid" style="margin-top:10px">
      ${plano.map(p => { const q = (S.plano && S.plano[p.id]) || 0;
        return `<div class="prod-tile ${q ? 'sel' : ''}" id="pt-${p.id}">
          <div class="pt-emoji">${p.emoji}</div>
          <div class="pt-name">${esc(p.nome)}</div>
          <div class="pt-qty">
            <button onclick="planoQty('${p.id}', -1, event)" aria-label="Menos">−</button>
            <span class="v" id="ptv-${p.id}">${q}</span>
            <button onclick="planoQty('${p.id}', 1, event)" aria-label="Mais">+</button>
          </div>
        </div>`; }).join('')}
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap">
      <button class="btn btn-primary" id="plano-save" disabled onclick="registrarProducao()">Registrar produção</button>
      <span class="f-hint" id="plano-hint">selecione quantidades acima</span>
    </div>

    <div class="section" style="margin-top:26px"><span class="eyebrow">Lotes em validade</span>
      <div class="rows" style="margin-top:8px">
        ${S.lotes.map(l => `<div class="row" style="grid-template-columns:1fr auto auto auto">
          <span><span class="row-main">${esc(l.prod)}</span><div class="row-sub mono">${l.id} · feito ${l.feito}</div></span>
          <span class="row-num">${l.qty} ${l.un}</span>
          <span class="pill ${l.valN === 0 ? 'pill-crit' : l.valN <= 1 ? 'pill-warn' : 'pill-ok'}">${l.val === 'hoje' || l.val === 'amanhã' ? 'vence ' + l.val : 'val ' + l.val}</span>
          <button class="btn btn-secondary btn-sm" data-tip="Etiqueta com logo e validade" onclick="printLabel('${l.id}')">${ico('print', 13)} Etiqueta</button>
        </div>`).join('')}
      </div>
    </div>`;
}
function planoQty(id, d, ev){
  ev.stopPropagation();
  S.plano = S.plano || {};
  S.plano[id] = Math.max(0, (S.plano[id] || 0) + d);
  document.getElementById('ptv-' + id).textContent = S.plano[id];
  document.getElementById('pt-' + id).classList.toggle('sel', S.plano[id] > 0);
  const total = Object.values(S.plano).reduce((s, v) => s + v, 0);
  const btn = document.getElementById('plano-save');
  btn.disabled = total === 0;
  document.getElementById('plano-hint').textContent = total ? `${total} un selecionadas` : 'selecione quantidades acima';
}
function registrarProducao(){
  const items = Object.entries(S.plano || {}).filter(([, q]) => q > 0);
  if(!items.length) return;
  confirmDlg({
    title:'Registrar produção de hoje?',
    desc: items.map(([id, q]) => `${q}× ${S.produtos.find(p => p.id === id).nome}`).join(', ') + '. Cada lote sai com validade calculada e etiqueta pronta pra imprimir.',
    confirmLabel:'Registrar e imprimir etiquetas',
    onConfirm:() => {
      items.forEach(([id, q]) => {
        const p = S.produtos.find(x => x.id === id);
        S.lotes.unshift({ id:'lot_' + Math.random().toString(36).slice(2, 6), prod:p.nome, qty:q, un:'un', feito:'agora', val:'18 ago', valN:3 });
        /* baixa de insumos pela ficha técnica */
        (S.receitas[id] || []).forEach(r => {
          const ins = S.stock.find(s => s.id === r.ins);
          if(ins) ins.qty = Math.max(0, Math.round((ins.qty - r.q * q) * 100) / 100);

function calcDaDemanda(){
  /* calculadora: demanda aberta × ficha técnica vs estoque */
  const dem = demandaAberta();
  const need = {};
  dem.forEach(d => {
    const prod = S.produtos.find(p => p.nome === d.nome);
    (S.receitas[prod?.id] || []).forEach(r => { need[r.ins] = need[r.ins] || { nome:r.nome, un:r.un, q:0 }; need[r.ins].q += r.q * d.q; });
  });
  const rows = Object.entries(need).map(([ins, n]) => {
    const st = S.stock.find(s => s.id === ins);
    const falta = st ? Math.max(0, n.q - st.qty) : n.q;
    return { ...n, tem:st ? st.qty : 0, falta, ins };
  });
  openDrawer(`
    <div class="drawer-head"><h2>Insumos da demanda aberta</h2><button class="icon-btn" onclick="closeDrawer()">${ico('x', 15)}</button></div>
    <div class="drawer-body">
      <p class="f-hint" style="margin-bottom:12px">Pela ficha técnica de cada produto na fila, contra o estoque de agora.</p>
      ${rows.map(r => `<div class="calc-row">
        <span><b>${esc(r.nome)}</b><div class="row-sub">tem ${String(r.tem).replace('.', ',')} ${r.un} · precisa ${r.q.toFixed(1).replace('.', ',')} ${r.un}</div></span>
        ${r.falta > 0 ? `<span class="tag-lack">faltam ${r.falta.toFixed(1).replace('.', ',')} ${r.un}</span>` : '<span class="tag-ok">✓ tem</span>'}
        ${r.falta > 0 ? `<button class="btn btn-secondary btn-sm" onclick="toast('${esc(r.nome)} foi pra lista de Compras')">Comprar</button>` : '<span></span>'}
      </div>`).join('')}
      ${rows.some(r => r.falta > 0) ? `<button class="btn btn-primary btn-block" style="margin-top:16px" onclick="closeDrawer();openModule('compras');toast('Faltantes na lista de Compras')">Jogar faltantes em Compras</button>` : `<p class="f-hint" style="margin-top:14px;text-align:center">Estoque cobre a demanda inteira. Boa.</p>`}
    </div>`);
}

/* ═══ PUSH UNIFICADO — toast e evento no mesmo padrão, no topo ═══ */
function push({ icon = '✓', tint = 'var(--accent)', title, sub = '', onclick = null, sticky = false }){
  let zone = document.querySelector('.push-zone');
  if(!zone){
    zone = document.createElement('div');
    zone.className = 'push-zone';
    zone.setAttribute('aria-live', 'polite');
    document.body.appendChild(zone);
  }
  const el = document.createElement('div');
  el.className = 'push';
  el.setAttribute('role', 'status');
  el.innerHTML = `<span class="p-ico" style="background:color-mix(in srgb, ${tint} 13%, transparent)">${icon}</span>
    <span style="flex:1;min-width:0"><div class="p-title">${esc(title)}</div>${sub ? `<div class="p-sub">${esc(sub)}</div>` : ''}</span>`;
  if(onclick){ el.style.cursor = 'pointer'; el.onclick = () => { dismiss(); onclick(); }; }
  zone.prepend(el);
  while(zone.children.length > 3) zone.lastChild.remove();
  let t;
  const dismiss = () => { clearTimeout(t); el.classList.add('leaving'); setTimeout(() => el.remove(), 260); };
  if(!sticky) t = setTimeout(dismiss, 3600);
  el.onmouseenter = () => clearTimeout(t);
  el.onmouseleave = () => { if(!sticky) t = setTimeout(dismiss, 1600); };
  return dismiss;
}
/* toast vira push: mesma assinatura, novo padrão */
function toast(msg){
  push({ title:msg, icon:'✓', tint:'var(--ok)' });
}
/* evento importante = push clicável que leva ao lugar certo */
function pushEvento(e){
  push({ icon:e.icon, tint:e.tint, title:e.t, sub:'toque pra ver', onclick:() => eval(e.acao.fn) });
}
function pushEvent(e){
  S.eventos.unshift({ id:'ev_' + Math.random().toString(36).slice(2, 6), when:'agora', unread:true, orderId:e.orderId, ...e });
  if(document.body.classList.contains('ev-open')) renderEvents();
  syncBell();
  pushEvento(e);
}

function getA11y(){ try{ return JSON.parse(localStorage.getItem(A11Y_KEY)) || {}; }catch(e){ return {}; } }

function sendTemplate(){
  const cur = S.conversas.find(c => c.id === (S.chatId || S.conversas[0].id));
  cur.msgs.push({ dir:'out', t:'📋 [template] Olá! Aqui é a Casa da Babá. Passando pra atualizar sobre seu pedido…', h:'agora' });
  META_WIN[cur.id] = 'open';
  audit(`enviou template Meta pra ${cur.nome}`);

}
function sendChat(){
  const inp = document.getElementById('chat-in');
  if(!inp) return;
  const t = inp.value.trim();
  if(!t) return;
  const cur = S.conversas.find(c => c.id === (S.chatId || S.conversas[0].id));
  cur.msgs.push({ dir:'out', t, h:'agora' });
  cur.unread = 0;
  audit(`respondeu ${cur.nome} no ${cur.canal === 'wa' ? 'WhatsApp' : cur.canal === 'ig' ? 'Instagram' : 'iFood'}`);
  rerender();
  setTimeout(() => { const b = document.getElementById('chat-body'); if(b) b.scrollTop = b.scrollHeight; }, 0);
}

/* ═══ ≤3 CLIQUES DE QUALQUER LUGAR — quick actions no feed de eventos ═══ */
function evQuickOrder(orderId, evId){
  const o = S.orders.find(x => x.id === orderId);
  if(!o) return;
  const next = STATUS[o.status].next;
  if(next){ o.status = next; o.at = Date.now(); audit(`moveu pedido #${o.n} pra ${next} pelo centro de eventos`); }
  const e = S.eventos.find(x => x.id === evId);
  if(e) e.unread = false;
  renderEvents(); syncBell();
  push({ title:`#${o.n} → ${STATUS[next]?.label || ''}`, sub:'sem sair da tela', icon:'🧾' });
  rerender();
}
function evQuickReply(evId){
  const e = S.eventos.find(x => x.id === evId);
  const box = document.getElementById('evqr-' + evId);
  if(box){ box.remove(); return; }
  const item = document.querySelector(`.ev-item[data-ev="${evId}"]`);
  if(!item) return;
  const div = document.createElement('div');
  div.id = 'evqr-' + evId;
  div.style.cssText = 'margin-top:8px;display:flex;gap:6px';
  div.innerHTML = `<input class="f-input" style="height:32px;font-size:12.5px;flex:1" placeholder="Resposta rápida…" onkeydown="if(event.key==='Enter')evSendReply('${evId}',this.value)">
    <button class="btn btn-primary btn-sm" onclick="evSendReply('${evId}',this.previousElementSibling.value)">Enviar</button>`;
  item.appendChild(div);
  setTimeout(() => div.querySelector('input').focus(), 0);
}
function evSendReply(evId, text){
  if(!text.trim()) return;
  const e = S.eventos.find(x => x.id === evId);
  const conv = S.conversas.find(c => e.t.includes(c.nome)) || S.conversas[0];
  conv.msgs.push({ dir:'out', t:text.trim(), h:'agora' });
  e.unread = false;
  audit(`resposta rápida pra ${conv.nome}`);
  renderEvents(); syncBell();
  push({ title:'Resposta enviada', sub:`pra ${conv.nome} · sem navegar`, icon:'💬', tint:'#128C4B' });
}
