services:
  postgres:
    container_name: homol-postgres
    ports: !reset []
  api:
    image: easystock-api-homol:latest
    container_name: homol-api
    ports: !override
      - "127.0.0.1:18510:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SEED_EMPRESA_NOME: "Casa da Baba Homologacao"
      SEED_DEMO_DATA: "true"
      Anthropic__Enabled: "true"
      Anthropic__ApiKey: ""
      Anthropic__ApiKeyAgente: "${FW_KEY}"
      Anthropic__AutenticacaoBearer: "true"
      Anthropic__BaseUrl: "http://host.docker.internal:18610/"
      Anthropic__ModeloAgente: "accounts/fireworks/models/deepseek-v4p1-flash"
      Atendimento__WhatsApp__Cliente: "meta"
      Notifications__WhatsApp__Provider: "meta"
      Notifications__WhatsApp__Meta__AccessToken: "token-falso-homologacao"
      Notifications__WhatsApp__Meta__AppSecret: "${META_APPSECRET}"
      Notifications__WhatsApp__Meta__VerifyToken: "verify-homol"
      Notifications__WhatsApp__Meta__BaseUrl: "http://host.docker.internal:18620/v19.0"
      Notifications__WhatsApp__Meta__PhoneNumberId: "homol-001"
      MercadoPago__UseStub: "false"
      MercadoPago__AccessToken: "token-mp-falso"
      MercadoPago__BaseUrl: "http://host.docker.internal:18630/"
      MercadoPago__WebhookSecret: "homol-mp-secret"
      ENABLE_VIACEP_LOOKUP: "true"
      ENABLE_NOMINATIM_GEOCODING: "true"
