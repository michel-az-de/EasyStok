# Renderizador do impresso Pix (#3017): Gotenberg (Chromium) que transforma o HTML do impresso em PNG.
# Stack própria em /opt/stacks/gotenberg, na rede "edge" da stack easystok (externa, como o WAHA e o Whisper), sem
# porta publicada. A API chama http://gotenberg:3000 (alias de rede), então não precisa editar o compose da stack.
# Fica FORA do `compose up` da api/worker/web: uma falha dele não derruba a API nem o rollback, e o envio cai no texto.
# Subir com scripts/deploy/gotenberg-deploy.sh.
name: gotenberg
services:
  gotenberg:
    image: gotenberg/gotenberg:8.38.1
    container_name: ez-gotenberg
    restart: unless-stopped
    mem_limit: 512m
    environment:
      TZ: America/Sao_Paulo
    command:
      - "gotenberg"
      - "--api-timeout=30s"
      - "--chromium-max-concurrency=2"
      - "--chromium-restart-after=50"
    healthcheck:
      # A imagem traz curl (conferido em 8.x).
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      edge:
        aliases: [gotenberg]

networks:
  edge:
    external: true
    name: edge
