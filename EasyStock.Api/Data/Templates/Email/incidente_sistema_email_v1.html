<html><head><meta charset="utf-8"></head><body style="font-family:sans-serif;font-size:16px;line-height:1.5;color:#1f2937;max-width:600px;margin:auto;background:#f8fafd;padding:20px">
<div style="background:#0E2A6E;padding:20px;text-align:center;border-radius:8px 8px 0 0">
  <h1 style="color:#fff;margin:0;font-size:24px">Easy<span style="color:#FFB27A">Stok</span></h1>
</div>
<div style="background:#fff;padding:24px;border-radius:0 0 8px 8px">
  <h2 style="color:#0E2A6E;font-size:20px">Incidente no sistema</h2>
  <p>O componente <strong>{{ componente }}</strong> está <strong>{{ estado_texto }}</strong>.</p>
  <table role="presentation" style="border-collapse:collapse;width:100%;font-size:16px">
    <tr><td style="padding:6px 0;color:#4b5563">Gravidade</td><td style="padding:6px 0"><strong>{{ gravidade }}</strong></td></tr>
    <tr><td style="padding:6px 0;color:#4b5563">Desde</td><td style="padding:6px 0"><strong>{{ desde }}</strong></td></tr>
    <tr><td style="padding:6px 0;color:#4b5563">Duração</td><td style="padding:6px 0"><strong>{{ duracao }}</strong></td></tr>
  </table>
  <p style="color:#4b5563;font-size:16px">Aviso automático da plataforma para a operação do EasyStok.</p>
</div>
</body></html>
