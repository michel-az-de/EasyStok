<html><head><meta charset="utf-8"></head><body style="font-family:sans-serif;font-size:18px;line-height:1.5;color:#1f2937;max-width:600px;margin:auto;background:#f8fafd;padding:20px">
<div style="background:#5B3A1E;padding:20px;text-align:center;border-radius:8px 8px 0 0">
  <h1 style="color:#fff;margin:0;font-size:24px">Casa da Baba</h1>
</div>
<div style="background:#fff;padding:24px;border-radius:0 0 8px 8px">
  <h2 style="color:#5B3A1E;font-size:22px">{{ titulo | html.escape }}</h2>
  <p>{{ texto | html.escape }}</p>
  {{ if link && link != "" }}<p style="text-align:center;margin:24px 0">
    <a href="{{ link | html.escape }}" style="display:inline-block;background:#C2410C;color:#fff;padding:12px 28px;border-radius:6px;text-decoration:none;font-weight:700;font-size:18px">Abrir no console</a>
  </p>
  <p style="color:#4b5563;font-size:16px">Se o botão não abrir, copie este endereço no navegador: <span style="word-break:break-all">{{ link | html.escape }}</span></p>{{ end }}
</div>
</body></html>
