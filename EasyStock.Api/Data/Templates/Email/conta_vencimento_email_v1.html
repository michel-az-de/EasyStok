<html><head><meta charset="utf-8"></head><body style="font-family:sans-serif;font-size:16px;line-height:1.5;color:#1f2937;max-width:600px;margin:auto;background:#f8fafd;padding:20px">
<div style="background:#5B3A1E;padding:20px;text-align:center;border-radius:8px 8px 0 0">
  <h1 style="color:#fff;margin:0;font-size:24px">Casa da Baba</h1>
</div>
<div style="background:#fff;padding:24px;border-radius:0 0 8px 8px">
  <h2 style="color:#5B3A1E;font-size:20px">{{ titulo_texto }}</h2>
  <p><strong>{{ descricao_texto }}</strong>, parcela {{ numero }}: {{ situacao_texto }}.</p>
  <table role="presentation" style="border-collapse:collapse;width:100%;font-size:16px">
    <tr><td style="padding:6px 0;color:#4b5563">Valor em aberto</td><td style="padding:6px 0"><strong>{{ valor_texto }}</strong></td></tr>
    <tr><td style="padding:6px 0;color:#4b5563">Vencimento</td><td style="padding:6px 0"><strong>{{ vencimento_texto }}</strong></td></tr>
  </table>
  <p>Abra o Financeiro no EasyStok para registrar o pagamento ou ajustar a data.</p>
</div>
</body></html>
